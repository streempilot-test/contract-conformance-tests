name: Atto LLVM scoped dispatch exact native guests
on:
  push:
    branches: [ci/atto-llvm1071-dispatch-trap-20261127]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Fetch and verify exact public source
        run: |
          git init source
          git -C source fetch --depth=1 https://github.com/atto-lang/atto-source.llvm.git eeb0b879f9eb3cb356af0f04b089d24c6fef414e
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = eeb0b879f9eb3cb356af0f04b089d24c6fef414e
          test "$(git -C source rev-parse HEAD^{tree})" = fb0c0290897a2b063b99a9475af649fc8ea650b1
      - name: Install LLVM toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq llvm-18-dev clang-18 lld-18 libzstd-dev wabt cmake file
      - name: Build native compiler
        working-directory: source
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm -DORE_CLANG=/usr/bin/clang-18 -DBUILD_TESTING=ON
          cmake --build build --target oreslang-llvmc -j2
      - name: Execute new linked native guest and negative controls
        working-directory: source
        run: ctest --test-dir build --output-on-failure -R '^native_delimited_procedural_dispatch_runtime
      - name: Execute existing native dispatch regressions
        working-directory: source
        run: ctest --test-dir build --output-on-failure -R '^native_(do_match_function_return|do_switch_function_return|do_switch_default_only|do_match_wildcard_only|value_match_arm_result|value_switch_arm_result)_runtime$' --no-tests=error
 --no-tests=error -V
      - name: Execute existing native dispatch regressions
        working-directory: source
        run: ctest --test-dir build --output-on-failure -R '^native_(do_match_function_return|do_switch_function_return|do_switch_default_only|do_match_wildcard_only|value_match_arm_result|value_switch_arm_result)_runtime$' --no-tests=error
