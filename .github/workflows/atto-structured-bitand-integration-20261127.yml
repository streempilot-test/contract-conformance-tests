name: Atto structured bitand current integration
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-structured-bitand-integration-20261127.yml']
permissions:
  contents: read
jobs:
  clr:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Reconstruct exact candidate and current base
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags https://github.com/atto-lang/atto-source.net.git ffad76ef24185d5970e0970762a31a4793d984f5 89abd65f05b452df74774e5f872e7154fc842e61
          git -C source checkout --detach 89abd65f05b452df74774e5f872e7154fc842e61
          git -C source -c user.name=CI -c user.email=ci@example.invalid merge --no-edit --no-ff ffad76ef24185d5970e0970762a31a4793d984f5
          git -C source rev-parse HEAD^{tree}
          git -C source diff --stat 89abd65f05b452df74774e5f872e7154fc842e61 HEAD
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile and execute integrated CIL
        shell: bash
        run: |
          set -euo pipefail
          cd source
          dotnet run -c Release --project verification/Ores.Net.StructuredBitAndProbe/Ores.Net.StructuredBitAndProbe.csproj
          git diff --exit-code
