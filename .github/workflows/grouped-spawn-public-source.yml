name: Public exact-tree grouped spawn compiler checks
on:
  push:
    branches:
      - ci/grouped-spawn-public-exact-source-20261126
permissions: {}
jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: java
            repo: atto-lang/atto-source.java
            head: 035d5c1475f106ad31b58f3996f12e8913ad9cc1
            tree: c2aec96692fb07facdb8c98d0d268da75150bdca
          - backend: rust
            repo: atto-lang/atto-source.rs
            head: 737f00c618e3860a0f9caef711ec36e297556594
            tree: 856e7189cc5f19d8f33390090ac244553861dbbf
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch publicly readable immutable source, without credentials
        env:
          SOURCE_REPO: ${{ matrix.repo }}
          EXPECTED_HEAD: ${{ matrix.head }}
          EXPECTED_TREE: ${{ matrix.tree }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          case "$SOURCE_REPO" in atto-lang/atto-source.java|atto-lang/atto-source.rs) ;; *) exit 2;; esac
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ && "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          git init source
          git -C source -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 "https://github.com/$SOURCE_REPO.git" "$EXPECTED_HEAD"
          git -C source -c advice.detachedHead=false checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git -C source status --porcelain --untracked-files=all)"
          printf 'PUBLIC_SOURCE_EXACT_HEAD=%s\nPUBLIC_SOURCE_EXACT_TREE=%s\n' "$EXPECTED_HEAD" "$EXPECTED_TREE"
      - name: Java quota and lifecycle host smoke
        if: matrix.backend == 'java'
        working-directory: source
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          mkdir -p target/grouped-spawn-host
          javac --release 21 -d target/grouped-spawn-host \
            src/main/java/dev/oreslang/runtime/ActorSpawnReservation.java \
            src/test/java/dev/oreslang/runtime/ActorSpawnReservationSmoke.java
          java -cp target/grouped-spawn-host dev.oreslang.runtime.ActorSpawnReservationSmoke
      - name: Java production parser regression
        if: matrix.backend == 'java'
        working-directory: source
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          mvn -B -ntp -Dtest=GroupedActorSpawnParserAdmissionTest,ParserTest test
      - name: Rust production parser admission
        if: matrix.backend == 'rust'
        working-directory: source
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 test --locked --test grouped_spawn_admission
      - name: Evidence boundary
        run: echo 'PUBLIC_SOURCE_TREE_TESTS_ONLY; NO PRIVATE EXPORT; NOT GROUPED SPAWN GUEST PARITY'
