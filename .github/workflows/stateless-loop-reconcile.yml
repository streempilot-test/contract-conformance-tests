name: Exact reconciled Rust stateless loop gate
on:
  pull_request:
    paths:
      - '.github/workflows/stateless-loop-reconcile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Authenticate exact public source
        run: |
          set -euo pipefail
          git init src
          git -C src -c credential.helper= -c http.extraHeader= fetch --depth=1 --no-tags https://github.com/atto-lang/atto-source.rs.git 11ad063c15cf493eb5660c7aaa3aa961da51f171
          git -C src checkout --detach FETCH_HEAD
          test "$(git -C src rev-parse HEAD)" = 11ad063c15cf493eb5660c7aaa3aa961da51f171
          test "$(git -C src rev-parse HEAD^{tree})" = bfc048678138f2bea6669bb33cb2d9cc037fe740
          test "$(git -C src write-tree)" = bfc048678138f2bea6669bb33cb2d9cc037fe740
      - name: Build actual native and wasm32 compiler, execute guests
        run: |
          set -euo pipefail
          cd src
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          cargo +1.85.1 build --locked --release --bin attoc
          cargo +1.85.1 rustc --locked --release --lib --target wasm32-unknown-unknown --crate-type cdylib -- -C link-arg=--max-memory=67108864
          ATTOC=target/release/attoc node tests/conformance.mjs
          git diff --exit-code
      - name: Regress merged spawn parser and state terminal matrix
        run: |
          set -euo pipefail
          cd src
          cargo +1.85.1 test --locked --test grouped_spawn_admission
          node --test tests/state-terminal-matrix.test.mjs
