name: Atto exact-source narrow regression qualification
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-narrow-regressions-20261127.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: js
            repo: atto-source.js
            head: f269c618e14fd2bf1ef75919a05a999c5fdfecdb
            tree: 29c02ff4a8b0dd582f318b695ac54f3f0785db4a
          - lane: llvm-host
            repo: atto-source.llvm
            head: 653c0f1aca6a4a87c2f95252ceb42c977b2c38ae
            tree: 7bc97ee0581930d6c4e3f486521ddda68432b3ee
          - lane: cranelift
            repo: atto-source.cranelift
            head: 61b1a516267a235ca739c61543fe2dc3f22491f5
            tree: f6a1ea796e339099c58dac806e0c6cca4aa529b7
    steps:
      - name: Fetch verified public source without credentials
        env:
          SOURCE_REPO: ${{ matrix.repo }}
          SOURCE_HEAD: ${{ matrix.head }}
          SOURCE_TREE: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          mkdir source
          git -C source init -q
          git -C source -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 "https://github.com/atto-lang/$SOURCE_REPO.git" "$SOURCE_HEAD"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git -C source diff --quiet HEAD --
          test -z "$(git -C source ls-files --others --exclude-standard)"
          test -z "$(git -C source ls-files --others --ignored --exclude-standard)"
          git -C source rev-parse HEAD 'HEAD^{tree}'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: matrix.lane == 'js'
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: matrix.lane == 'cranelift'
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Execute actual narrow tests and applicable regression
        working-directory: source
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          case "$LANE" in
            js)
              node --test tests/http-actor-fixture-pins.test.mjs tests/http-actor-admission.test.mjs
              npm test
              npm run check
              ;;
            llvm-host)
              python3 tests/test_native_http_startup.py -v
              ;;
            cranelift)
              cargo test --locked multi_owner_close_and_drop_wait_for_physical_unwind
              cargo test --locked --all-targets
              cargo clippy --locked --all-targets -- -D warnings
              ;;
            *) exit 1 ;;
          esac
          git diff --quiet HEAD --
          echo "SCOPED_EXECUTED_TESTS_COMPLETE=$LANE"
