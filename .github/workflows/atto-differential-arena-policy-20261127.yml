name: Atto differential arena policy guest
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-differential-arena-policy-20261127.yml']
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: rs
            head: d3c05bf5ecb61c1d3368bb745dc57961344a4f86
          - backend: js
            head: e86ec2499f13a259b854323da44b231910fcdd98
    steps:
      - name: Fetch exact public source
        env:
          BACKEND: ${{ matrix.backend }}
          HEAD_SHA: ${{ matrix.head }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 "https://github.com/atto-lang/atto-source.$BACKEND.git" "$HEAD_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$HEAD_SHA"
          git -C source rev-parse HEAD^{tree}
          git -C source hash-object tests/arena-policy-differential-v1.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile actual Rust frontend and execute generated Wasm corpus
        if: matrix.backend == 'rs'
        shell: bash
        run: |
          set -euo pipefail
          cd source
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 build --locked --release --bin attoc
          ATTOC="$PWD/target/release/attoc" node tests/arena-quota-lifecycle-guest.mjs
          git diff --exit-code
      - name: Execute actual compiler-emitted ESM corpus
        if: matrix.backend == 'js'
        shell: bash
        run: |
          set -euo pipefail
          cd source
          node --test tests/arena-quota-lifecycle-guest.test.mjs
          git diff --exit-code
