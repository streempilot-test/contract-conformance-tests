name: Atto public callable parity exact-head audit
on:
  pull_request:
    paths:
      - '.github/workflows/atto-callable-parity-20261127.yml'
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: atto-source.rs
            head: 51bca5fe37f5ef8b6cfe719ce0a42c1aa44b74a3
            lane: rust
            tree: 11e3a7b573a2ea133c243ebae020d69bdb9d5360
          - repo: atto-source.java
            head: 00b8e2ccd575cb2b249d07857d7e26bee7560dc7
            lane: java
            tree: 03ee9d84aaa7e74a627ad2e7b8ef712adf457e15
          - repo: atto-source.llvm
            head: c917e9ae0153f0003461349074879ad570374c35
            lane: llvm
            tree: 7229f98e568876ea0ee22475be0148607b293ba3
    env:
      SOURCE_REPO: ${{ matrix.repo }}
      SOURCE_HEAD: ${{ matrix.head }}
      LANE: ${{ matrix.lane }}
      SOURCE_TREE: ${{ matrix.tree }}
    steps:
      - name: Anonymous public source fetch and exact physical Git identity
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE_REPO:$SOURCE_HEAD:$SOURCE_TREE" in
            atto-source.rs:51bca5fe37f5ef8b6cfe719ce0a42c1aa44b74a3:11e3a7b573a2ea133c243ebae020d69bdb9d5360|atto-source.java:00b8e2ccd575cb2b249d07857d7e26bee7560dc7:03ee9d84aaa7e74a627ad2e7b8ef712adf457e15|atto-source.llvm:c917e9ae0153f0003461349074879ad570374c35:7229f98e568876ea0ee22475be0148607b293ba3) ;;
            *) exit 1 ;;
          esac
          mkdir source
          cd source
          git init
          GIT_TERMINAL_PROMPT=0 git -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 "https://github.com/atto-lang/$SOURCE_REPO.git" "$SOURCE_HEAD"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git write-tree)" = "$SOURCE_TREE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git diff --exit-code HEAD --
          git rev-parse HEAD 'HEAD^{tree}'
      - name: Execute scoped tests
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          case "$LANE" in
            rust)
              rustc --version
              cargo test --locked --test source_control_admission --test source_unicode_control_admission --test structural_ast_depth_cli --test source_callable_types --test call_spread_ellipsis_admission --test direct_lambda --test direct_lambda_audit
              cargo build --locked --bin attoc
              node tests/callable_guest_execution.mjs
              cargo test --locked --all-targets
              ;;
            cranelift)
              cargo test --locked --bin orescranelift linked_native:: -- --nocapture
              cargo test --locked --test named_aggregate_guest --test structural_ast_depth --test combined_scalar_features
              ;;
            net)
              dotnet --info
              dotnet run --configuration Release --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj -- --empty-local-products | tee "$RUNNER_TEMP/product-receipt.log"
              grep -Fx 'EMPTY_LOCAL_PRODUCT_CORECLR_PASS positives=10 negatives=15' "$RUNNER_TEMP/product-receipt.log"
              ;;
            java)
              export JAVA_HOME="$JAVA_HOME_21_X64"
              export PATH="$JAVA_HOME/bin:$PATH"
              mvn -B -Dtest=IntrinsicContextualSingletonTupleTest,RecursiveRecordParserTest test
              ;;
            llvm)
              sudo apt-get update
              sudo apt-get install -y build-essential cmake clang llvm-dev jq
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
              cmake --build build --parallel 2 --target oreslang-llvmc oreslang-rust-test-harness
              ctest --test-dir build --show-only=json-v1 > build/named-call-tests.json
              for name in native_shared_named_equals native_shared_named_mixed native_shared_named_positional native_shared_named_order_reject native_shared_named_unknown_reject native_shared_named_duplicate_reject native_shared_named_pair_reject; do
                jq -e --arg name "$name" '.tests | any(.name == $name)' build/named-call-tests.json >/dev/null
              done
              # Print the actual diagnostic of the two pre-existing fixtures
              # without altering their CTest expectations.
              for fixture in named-call-mut-borrow-native.ores named-call-mut-borrow-after-loan-reject.ores; do
                set +e
                build/oreslang-llvmc "tests/fixtures/$fixture" >"$RUNNER_TEMP/llvm-fixture.out" 2>"$RUNNER_TEMP/llvm-fixture.err"
                status=$?
                set -e
                printf '%s: diagnostic probe status=%s\n' "$fixture" "$status"
                cat "$RUNNER_TEMP/llvm-fixture.err"
              done
              ctest --test-dir build -R '^native_(shared_named_|named_(call_|member_))' --output-on-failure --no-tests=error --timeout 180 --parallel 2
              ;;
            *) exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git write-tree)" = "$SOURCE_TREE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git diff --exit-code HEAD --
