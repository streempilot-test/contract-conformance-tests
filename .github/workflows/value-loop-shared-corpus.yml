name: Exact public value loop corpus and compiler gates
on:
  pull_request:
    paths:
      - '.github/workflows/value-loop-shared-corpus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify exact public corpus and execute Node tests
        shell: bash
        run: |
          set -euo pipefail
          git init corpus
          git -C corpus -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-platform-conformance.git 1b87dfac57a32ac12e5310227fafba53bbc5612a
          git -C corpus checkout --detach FETCH_HEAD
          test "$(git -C corpus rev-parse HEAD)" = 1b87dfac57a32ac12e5310227fafba53bbc5612a
          test "$(git -C corpus rev-parse HEAD^{tree})" = 9fa4a314c649410242af39267e583fccd5d6fc83
          test "$(git -C corpus write-tree)" = 9fa4a314c649410242af39267e583fccd5d6fc83
          test "$(git -C corpus hash-object tests/value-loop-recur-targets.test.mjs)" = 4c9dd15face69af79a5dd79eb7dfaab9c5320dfc
          cd corpus
          node --version
          node --test tests/value-loop-recur-targets.test.mjs
          git diff --exit-code
  cranelift-host-table:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify exact public compiler source and run host metadata tests
        shell: bash
        run: |
          set -euo pipefail
          git init src
          git -C src -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.cranelift.git 942baa72b2df5c44b38ae2fe7ba9ca33f41513f3
          git -C src checkout --detach FETCH_HEAD
          test "$(git -C src rev-parse HEAD)" = 942baa72b2df5c44b38ae2fe7ba9ca33f41513f3
          test "$(git -C src rev-parse HEAD^{tree})" = f709cf64b3eb2d44341887195e3d7dda1900f17e
          cd src
          rustc --version
          rustc --edition=2024 --test tests/flat_machine_table_v1.rs -o /tmp/flat-machine-table
          /tmp/flat-machine-table
          git diff --exit-code
  rust-loop-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Authenticate exact public Rust candidate
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.rs.git 05d1cf6841f2f91b1678c8e0c296dc476f5e3789
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 05d1cf6841f2f91b1678c8e0c296dc476f5e3789
          test "$(git -C source rev-parse HEAD^{tree})" = f6a23768c655ea6d3cb78bea8848d3e72e255ad8
          test "$(git -C source write-tree)" = f6a23768c655ea6d3cb78bea8848d3e72e255ad8
      - name: Build real compiler and execute full conformance (red target expected until implementation)
        shell: bash
        run: |
          set -euo pipefail
          cd source
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          cargo +1.85.1 build --locked --release --bin attoc
          cargo +1.85.1 rustc --locked --release --lib --target wasm32-unknown-unknown --crate-type cdylib -- -C link-arg=--max-memory=67108864
          ATTOC=target/release/attoc node tests/conformance.mjs
