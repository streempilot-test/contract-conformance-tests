name: Atto Java 2037 exact delimited subjects
on:
  push:
    branches: [ci/atto-java2037-delimited-20261127]
  pull_request:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify connector mirror and fetch public candidate
        run: |
          git init compiler
          git -C compiler fetch --depth=1 https://github.com/atto-lang/atto-source.java.git 88a1d2613eb72d415a3157949139d6521548b8a4
          git -C compiler checkout --detach FETCH_HEAD
          test "$(git -C compiler rev-parse HEAD)" = 88a1d2613eb72d415a3157949139d6521548b8a4
          test "$(git -C compiler rev-parse HEAD^{tree})" = 2811a9968112053fb8336080c8786b9b73e4ac68
          test "$(git hash-object mirror/src/main/java/dev/oreslang/parser/Parser.java)" = 39ef8c969308155d09e014ae9dbc1e8448210c71
          cmp mirror/src/main/java/dev/oreslang/parser/Parser.java compiler/src/main/java/dev/oreslang/parser/Parser.java
          test "$(git hash-object mirror/src/test/java/dev/oreslang/DelimitedMatchSubjectTest.java)" = 0ed137180f5ff012f79288132983f93c788104b1
          cmp mirror/src/test/java/dev/oreslang/DelimitedMatchSubjectTest.java compiler/src/test/java/dev/oreslang/DelimitedMatchSubjectTest.java
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Execute real Graal compiler and guest tests
        working-directory: compiler
        run: mvn -B -ntp -Dtest=DelimitedMatchSubjectTest -Dsurefire.failIfNoSpecifiedTests=true test
