name: Approved shared Unicode and Rust export integration gate
on:
  push:
    branches: ['ci/approved-export-unicode-current-20261127']
permissions: {}
jobs:
  rust_llvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: rust
            repo: atto-source.rs
            head: ed88e124d51df093b9c7c1275736621d351aac66
            tree: 7499d4b6d58beb1203d5cd5f4453c9a09a41f64f
          - profile: llvm-browser
            repo: atto-source.llvm
            head: 8b798cb1abf36fbd8975be92e92827ad6d6e70d6
            tree: db370a10a8b2962dd09a40b340098feb9abc9c4e
    env:
      PROFILE: ${{ matrix.profile }}
      SOURCE_REPO: ${{ matrix.repo }}
      SOURCE_HEAD: ${{ matrix.head }}
      SOURCE_TREE: ${{ matrix.tree }}
      COMMON_HEAD: 64b590fbd024f66f1e8471dec2a7d3bba88eaab3
      COMMON_TREE: 4f1a69d5dbac93afcf38731bda28824ab11cc943
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Anonymous exact source checkout and root tree verification
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          fetch_exact() {
            local repo="$1" head="$2" tree="$3" dest="$4"
            git init -q "$dest"
            if [ "$repo" = atto-common-source ]; then
              git -C "$dest" -c credential.helper= fetch --no-tags "https://github.com/atto-lang/$repo.git" "$head" a526c7c6aa61fa509727418e3f919cb8be43a4bb
            else
              git -C "$dest" -c credential.helper= fetch --no-tags --depth=1 "https://github.com/atto-lang/$repo.git" "$head"
            fi
            git -C "$dest" checkout --detach FETCH_HEAD
            test "$(git -C "$dest" rev-parse HEAD)" = "$head"
            test "$(git -C "$dest" rev-parse HEAD^{tree})" = "$tree"
            test "$(git -C "$dest" write-tree)" = "$tree"
            test -z "$(git -C "$dest" status --porcelain --untracked-files=all)"
            git -C "$dest" fsck --full
            printf 'EXACT_SOURCE %s %s %s\n' "$repo" "$head" "$tree"
            if [ "$repo" = atto-common-source ]; then
              test "$(git -C "$dest" rev-parse 'a526c7c6aa61fa509727418e3f919cb8be43a4bb^{tree}')" = 71e2b610921553dce450d4f00438fbb01319e444
              git -C "$dest" checkout --detach a526c7c6aa61fa509727418e3f919cb8be43a4bb
              git -C "$dest" -c user.name=CI -c user.email=ci@example.invalid merge --no-commit --no-ff "$head"
              git -C "$dest" diff --quiet --
              test -z "$(git -C "$dest" ls-files -u)"
              echo "COMMON_INTEGRATION_TREE=$(git -C "$dest" write-tree)"
              node --test "$dest/tests/native-compiler-result-v1.test.mjs"
            fi
          }
          fetch_exact "$SOURCE_REPO" "$SOURCE_HEAD" "$SOURCE_TREE" "$RUNNER_TEMP/compiler"
          fetch_exact atto-common-source "$COMMON_HEAD" "$COMMON_TREE" "$RUNNER_TEMP/common"
      - name: Execute source-compiled guests and negative cases
        shell: bash
        run: |
          set -euo pipefail
          rustc --version; cargo --version; node --version; cc --version
          if [ "$PROFILE" = cranelift ]; then
            export CARGO_TARGET_DIR="$RUNNER_TEMP/cranelift-target"
            cd "$RUNNER_TEMP/compiler"
            cargo test --locked --test unicode_strict_not_native -- --nocapture
            cargo test --locked unicode_scalar_identifiers_are_distinct_and_resolve -- --nocapture
            test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
            test "$(git write-tree)" = "$SOURCE_TREE"
            test -z "$(git status --porcelain --untracked-files=all)"
          else
            node "$RUNNER_TEMP/common/scripts/run-unicode-wasm-conformance-v1.mjs" "$PROFILE" "$RUNNER_TEMP/compiler" "$SOURCE_HEAD" "$SOURCE_TREE"
          fi
