name: Hardened Java immutable recur guest qualification
on:
  push:
    branches: [ci/atto-recur-guard-integrated-421b08c]
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify exact public source
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          git init guest
          cd guest
          git -c credential.helper= fetch --depth=1 https://github.com/atto-lang/atto-source.java.git 421b08c7089202a97583d406b65a7c920ac952ae
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 421b08c7089202a97583d406b65a7c920ac952ae
          test "$(git rev-parse HEAD^{tree})" = b7779fb7f32166d0ad2e0233318bdd1f40e72980
          git fsck --full
      - uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '25'
      - name: Execute stateful and stateless guest regressions
        working-directory: guest
        run: mvn -B -ntp -Dtest=AttoStateValueLoopTest,AttoStatelessValueLoopTest test
