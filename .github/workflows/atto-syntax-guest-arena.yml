name: Atto syntax guest and native arena parity
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-syntax-guest-arena.yml']
permissions:
  contents: read
jobs:
  java-rendezvous:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify exact public source
        shell: bash
        run: |
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.java.git
          git -C source fetch --no-tags --depth=1 origin 03b0566fd2b1f45935e4cc78b2119ba8893be2b3
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "03b0566fd2b1f45935e4cc78b2119ba8893be2b3"
          git -C source rev-parse 'HEAD^{tree}'
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "a991262537886a437168563f8a5622f9cceccd15"
          test "$(git -C source hash-object src/main/java/dev/oreslang/parser/Parser.java)" = "4a88aba4daba2627658dbea02f4cb9f6856280c9"
          test "$(git -C source hash-object src/test/java/dev/oreslang/AttoDiamondDispatchParityTest.java)" = "e396a9011b2956e78a4879e00fd161f65feda4b0"
          test "$(git -C source hash-object src/test/java/dev/oreslang/InterfaceFncKeywordTest.java)" = "0c08960fae1f26422276dcbe2c2e0f55c57d3bce"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Nominal method and parser regressions
        working-directory: source
        run: mvn -B -ntp -Dtest=InterfaceFncKeywordTest,AttoDiamondDispatchParityTest,SuspensionAliasRendezvousGuestTest,DeclarativeExportsParserTest -DfailIfNoTests=true -Dsurefire.failIfNoSpecifiedTests=true test
      - name: Full JVM regression
        if: always()
        working-directory: source
        run: mvn -B -ntp test
