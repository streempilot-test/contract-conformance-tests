name: Atto syntax guest and native arena parity
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-syntax-guest-arena.yml']
permissions:
  contents: read
jobs:
  java-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify exact public source
        shell: bash
        run: |
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.java.git
          git -C source fetch --no-tags --depth=1 origin 454bf7655a90a4ee928197f18648eda4e26bbbad
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "454bf7655a90a4ee928197f18648eda4e26bbbad"
          git -C source rev-parse 'HEAD^{tree}'
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "0c67f344c2b80be1fd2c9202637b7fc7e68b732f"
          test "$(git -C source hash-object src/main/java/dev/oreslang/parser/Parser.java)" = "5150746dbce45c4d3f19f9214925fd5259168f8d"
          test "$(git -C source hash-object src/test/java/dev/oreslang/AttoDiamondDispatchParityTest.java)" = "4255bc42124c79e96aac742dd4d65b457f658755"
          test "$(git -C source hash-object src/test/java/dev/oreslang/InterfaceFncKeywordTest.java)" = "0251e51a63a8424931dfeb12c0aab4462296ad61"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Nominal method and parser regressions
        working-directory: source
        run: mvn -B -ntp -Dtest=InterfaceFncKeywordTest,AttoDiamondDispatchParityTest,MethodDeclarationSpellingTest,UnicodeIdentifierNegationV1Test,SharedUnicodeCorpusV1Test,SuspensionAliasRendezvousGuestTest,DeclarativeExportsParserTest -DfailIfNoTests=true -Dsurefire.failIfNoSpecifiedTests=true test
      - name: Install solver for full JVM regression
        if: always()
        run: sudo apt-get update -qq && sudo apt-get install -y z3
      - name: Full JVM regression
        if: always()
        working-directory: source
        run: mvn -B -ntp test
      - name: Same-runner mainline comparison
        if: always()
        working-directory: source
        run: |
          git fetch --depth=1 --no-tags origin 58d1e83b36733a82e5eb3857f3bffcb58d80f38b
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 58d1e83b36733a82e5eb3857f3bffcb58d80f38b
          rm -rf target
          mvn -B -ntp -o test
