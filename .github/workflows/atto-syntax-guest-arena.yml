name: Atto syntax guest and native arena parity
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-syntax-guest-arena.yml']
permissions:
  contents: read
jobs:
  java-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify exact public source
        shell: bash
        run: |
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.java.git
          git -C source fetch --no-tags --depth=1 origin 08ad289d90f070bc3eb4563895d8f38b8977ed2d
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "08ad289d90f070bc3eb4563895d8f38b8977ed2d"
          git -C source rev-parse 'HEAD^{tree}'
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "a4e13761776f37239f7452a02c00115dc104197f"
          test "$(git -C source hash-object src/main/java/dev/oreslang/parser/Parser.java)" = "4a88aba4daba2627658dbea02f4cb9f6856280c9"
          test "$(git -C source hash-object src/test/java/dev/oreslang/AttoDiamondDispatchParityTest.java)" = "4255bc42124c79e96aac742dd4d65b457f658755"
          test "$(git -C source hash-object src/test/java/dev/oreslang/InterfaceFncKeywordTest.java)" = "0251e51a63a8424931dfeb12c0aab4462296ad61"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Nominal method and parser regressions
        working-directory: source
        run: mvn -B -ntp -Dtest=InterfaceFncKeywordTest,AttoDiamondDispatchParityTest,SuspensionAliasRendezvousGuestTest,DeclarativeExportsParserTest -DfailIfNoTests=true -Dsurefire.failIfNoSpecifiedTests=true test
      - name: Install solver for full JVM regression
        if: always()
        run: sudo apt-get update -qq && sudo apt-get install -y z3
      - name: Full JVM regression
        if: always()
        working-directory: source
        run: mvn -B -ntp test
      - name: Same-runner mainline comparison
        if: always()
        working-directory: source
        run: |
          git fetch --depth=1 --no-tags origin 457f7394e9b572362a773202b480e4107d7319df
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 457f7394e9b572362a773202b480e4107d7319df
          rm -rf target
          mvn -B -ntp -o test
  net-mtd:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify exact public NET source
        run: |
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.net.git
          git -C source fetch --no-tags --depth=1 origin b9d24de092234b5c583d315c97780f7eec06919a
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = b9d24de092234b5c583d315c97780f7eec06919a
          test "$(git -C source rev-parse 'HEAD^{tree}')" = 8c0763b464cd66deeb20dd66e9c9b70ebecf9fa9
      - name: Production compiler managed self-tests
        working-directory: source
        run: dotnet run -c Release --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj
