name: Atto syntax guest and native arena parity
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-syntax-guest-arena.yml']
permissions:
  contents: read
jobs:
  js-mtd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify exact public source
        shell: bash
        run: |
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.js.git
          git -C source fetch --no-tags --depth=1 origin 4a013157c9daea0c022dc0745ed045f60c60cbc3
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "4a013157c9daea0c022dc0745ed045f60c60cbc3"
          git -C source rev-parse 'HEAD^{tree}'
          test "$(git -C source hash-object src/program-v2.mjs)" = "3d290d0b6e4e462bdb717ac88ccbf5dcb461e01f"
          test "$(git -C source hash-object tests/program-classes-v2.test.mjs)" = "8d13652f5f4df4b5db0e4ec1b76ef15776f45bce"
          test "$(git -C source hash-object tests/program-return-void-parity-20261111.test.mjs)" = "d8f5de841dbf087280c7c5884b24c448d709fedd"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "34a60eef209b0602938ef611a51c700780d0127e"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Focused actual compiler regression
        working-directory: source
        run: node --test tests/program-classes-v2.test.mjs tests/program-return-void-parity-20261111.test.mjs tests/declarative-exports.test.mjs
      - name: Full Node regression
        if: always()
        working-directory: source
        run: npm test
