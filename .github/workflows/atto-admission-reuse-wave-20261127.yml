name: Atto exact-source admission and reuse regression wave
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-admission-reuse-wave-20261127.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: hdl
            repo: atto-source.hdl
            head: 234cf388e30c7872adc6f5f01a72b5ce06f9a75c
            tree: b3adab65c3b3f9a0bde57c3db38da5790597f913
          - lane: rust
            repo: atto-source.rs
            head: 6f6c1350483b7f51ce2783ffb2cc84ef401ac7f3
            tree: 6fb10d4cda0252c8b0f2f1eb725f2f4b636053e4
          - lane: cranelift-http
            repo: atto-source.cranelift
            head: 003609a64db681882616abd68aadbea51a1eafc1
            tree: 805c7e894ee89c657bf26e918433deeab9733057
          - lane: cranelift-retirement
            repo: atto-source.cranelift
            head: 26f42bcc4a8b57583eda2babdddbb5ec04b737f8
            tree: 29a1cac697c2bbdb1c29e5ff38132fca23b8dee8
          - lane: reuse
            repo: atto-platform-conformance
            head: b8d438a986d5a30ebfcbad57b56b8f47b9d7fc0f
            tree: c9dbc359951c42e408965d64d0d7f2b043e9d7fc
    steps:
      - name: Fetch exact public source without credentials
        env:
          REPO: ${{ matrix.repo }}
          SOURCE_HEAD: ${{ matrix.head }}
          SOURCE_TREE: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          mkdir source
          git -C source init -q
          git -C source -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 "https://github.com/atto-lang/$REPO.git" "$SOURCE_HEAD"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git -C source diff --quiet HEAD --
          test -z "$(git -C source ls-files --others --exclude-standard)"
          git -C source rev-parse HEAD 'HEAD^{tree}'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: matrix.lane == 'rust' || startsWith(matrix.lane, 'cranelift')
        with:
          toolchain: '1.99.1'
          components: clippy
      - name: Execute real compiler admission and regression or structural tests
        working-directory: source
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          case "$LANE" in
            hdl) node --test tests/actor_machine_fail_closed_v1.test.mjs; npm test ;;
            rust) node --test tests/http-actor-fixture-pins.test.mjs; cargo test --manifest-path native/Cargo.toml --locked --test http_actor_admission ;;
            cranelift-http) node --test tests/http-actor-fixture-pins.test.mjs; cargo test --locked --test http_actor_unsupported_gate; cargo test --locked --all-targets; cargo clippy --locked --all-targets -- -D warnings ;;
            cranelift-retirement) cargo test --locked multi_owner_close_and_drop_wait_for_physical_unwind; cargo test --locked --all-targets; cargo clippy --locked --all-targets -- -D warnings ;;
            reuse) python3 tests/test_pool_reuse_receipt.py -v ;;
            *) exit 1 ;;
          esac
          git diff --quiet HEAD --
          echo "SCOPED_EXECUTED_TESTS_COMPLETE=$LANE"
