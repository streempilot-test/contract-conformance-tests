name: Atto actual NativeAOT policy corpus
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-net-nativeaot-policy-v1-20261127.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Fetch exact public source
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.net.git 1b6ef1448c5072f62c8f02e25273a0c2b89cc82b
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 1b6ef1448c5072f62c8f02e25273a0c2b89cc82b
          git -C source rev-parse HEAD^{tree}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute actual statically linked NativeAOT policy guests
        run: |
          set -euo pipefail
          cd source
          bash verification/Ores.Net.ArenaPolicyGuestProbe/run-nativeaot-policy.sh
