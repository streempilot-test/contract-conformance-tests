name: Atto exact CIL differential policy
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-cil-arena-differential-v1-20261127.yml']
permissions:
  contents: read
jobs:
  clr:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch exact public source
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.net.git 5189115fc156f15f8c970bccb509eff1df25ecf1
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 5189115fc156f15f8c970bccb509eff1df25ecf1
          git -C source rev-parse HEAD^{tree}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute committed differential guest gate
        shell: bash
        run: |
          set -euo pipefail
          cd source
          bash verification/Ores.Net.ArenaPolicyGuestProbe/run-guest-probes.sh
          git diff --exit-code
