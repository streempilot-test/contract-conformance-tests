name: Atto Cranelift 100k settlement and lint comparison
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  cranelift-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify exact public source
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          git init atto-source.cranelift
          cd atto-source.cranelift
          git -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=10 https://github.com/atto-lang/atto-source.cranelift.git refs/heads/test/multi-owner-continuation-settlement-20261127 1b73ae0fd69d1521cc7f13bf3029796e8ed3ad57
          git -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
          git -c core.hooksPath=/dev/null checkout --detach cf205939e7a48a2c078ac308e6c1ba4b3cea35d7
          test "$(git rev-parse HEAD)" = cf205939e7a48a2c078ac308e6c1ba4b3cea35d7
          test "$(git write-tree)" = "$(git rev-parse 'HEAD^{tree}')"
          test "$(git hash-object src/select_continuation_fence.rs)" = 42cc435e10dfb33e6e2e7759a3b36bab9de4aa44
          test "$(git diff --name-only 1b73ae0fd69d1521cc7f13bf3029796e8ed3ad57 HEAD)" = src/select_continuation_fence.rs
          git diff --exit-code HEAD
      - name: Execute stress and all-target regressions
        shell: bash
        working-directory: atto-source.cranelift
        run: |
          set -euo pipefail
          rustc --version
          cargo test --locked hundred_thousand_claim_cancel_schedules -- --nocapture
          cargo test --locked --all-targets
      - name: Compare strict lint diagnostics with unchanged base
        shell: bash
        working-directory: atto-source.cranelift
        run: |
          set -euo pipefail
          # Keep strict lint failure visible; compare diagnostics before returning failure.
          rc=0
          cargo clippy --locked --all-targets --message-format=json -- -D warnings > /tmp/candidate.jsonl || rc=$?
          git -c core.hooksPath=/dev/null checkout --detach 1b73ae0fd69d1521cc7f13bf3029796e8ed3ad57
          base_rc=0
          cargo clippy --locked --all-targets --message-format=json -- -D warnings > /tmp/base.jsonl || base_rc=$?
          python3 - <<'PY'
          import json
          def messages(path):
              result=set()
              for line in open(path):
                  try: obj=json.loads(line)
                  except ValueError: continue
                  if obj.get('reason')!='compiler-message': continue
                  m=obj['message']
                  if m.get('level')!='error' or not m.get('code'): continue
                  result.add((m['code']['code'],m['message'],tuple(sorted((s['file_name'],s['line_start']) for s in m['spans'] if s['is_primary']))))
              return result
          base=messages('/tmp/base.jsonl')
          candidate=messages('/tmp/candidate.jsonl')
          print('BASE_LINT_ERRORS',sorted(base))
          print('CANDIDATE_LINT_ERRORS',sorted(candidate))
          print('NEW_LINT_ERRORS',sorted(candidate-base))
          assert not candidate-base
          PY
          echo "STRICT_LINT_STATUS candidate=$rc base=$base_rc"
          exit "$rc"
