name: Atto native control arena try drop
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-net-control-try-drop-v1.yml']
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch exact public source
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.net.git f4de751661e62d9e9f699fdbbdd0287e79518be3
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = f4de751661e62d9e9f699fdbbdd0287e79518be3
          git -C source rev-parse HEAD^{tree}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: cd source && bash verification/Ores.Net.ControlPlaneArenaProbe/run-host-probe.sh
