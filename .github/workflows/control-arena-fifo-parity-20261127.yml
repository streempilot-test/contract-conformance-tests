name: Control arena FIFO exact-source parity
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/control-arena-fifo-parity-20261127.yml']
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: java
            head: 0a76f3a6ddd69864a02617526180332a2a21e184
            script: verification/control-plane-arena-v1/run-host-probe.sh
          - backend: net
            head: 30df01f0c6484e2a47c61fa868fa0ed3ecdb002c
            script: verification/Ores.Net.ControlPlaneArenaProbe/run-host-probe.sh
    steps:
      - name: Exact public source
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
          HEAD_SHA: ${{ matrix.head }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 "https://github.com/atto-lang/atto-source.$BACKEND.git" "$HEAD_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$HEAD_SHA"
          git -C source rev-parse HEAD^{tree}
      - uses: actions/setup-java@v4
        if: matrix.backend == 'java'
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-dotnet@v4
        if: matrix.backend == 'net'
        with:
          dotnet-version: '10.0.x'
      - name: Execute committed regression
        shell: bash
        env:
          SCRIPT: ${{ matrix.script }}
        run: |
          set -euo pipefail
          cd source
          bash "$SCRIPT"
          git diff --exit-code
