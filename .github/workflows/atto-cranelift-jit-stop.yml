name: Atto native Cranelift JIT continuation STOP composition
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-cranelift-jit-stop.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify exact source
        run: |
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.cranelift.git
          git -C source fetch --no-tags --depth=1 origin 6afa739b79a72d1647db7736d0320b08331bc827
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 6afa739b79a72d1647db7736d0320b08331bc827
          test "$(git -C source hash-object src/supervisor_stop.rs)" = 301cbf02ce61401d2c7be1b06b9d858a7f278d30
          test "$(git -C source hash-object src/select_continuation_fence.rs)" = a1eab934e9560b9340e577181e2cff10c06232a2
          git -C source rev-parse 'HEAD^{tree}'
      - name: Real native guest and host lifecycle
        working-directory: source
        run: cargo test --locked native_jit_completion_precedes_supervisor_stop_settlement -- --nocapture
      - name: Complete native regression
        if: always()
        working-directory: source
        run: cargo test --locked --all-targets --no-fail-fast
      - name: Formatting and strict lint
        if: always()
        working-directory: source
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
