name: Atto public exact-source conditional and regression qualification
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-conditional-exact-head-20261126.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: rust
            repo: atto-source.rs
            head: 8f39b13f2002dc5483f93ce95711043d0db500dc
            tree: 727047200a724854fab5a6cf38680c67e0b085e6
          - lane: js
            repo: atto-source.js
            head: b7432b81cfc646615cf3ae0034703649b3d318df
            tree: 5d9ce12250e0f53da31f2827c7a513c13ebbf63a
          - lane: formatter
            repo: atto-format
            head: 80d450a52a09b2e731eb85d4fe7faa1040685fd4
            tree: c9825fa36c3afcacdcbadff4b2443144cda19067
          - lane: clippy
            repo: atto-source.rs
            head: 818db8621425af970f4e668da7ce9d8cfacd200c
            tree: ff1e6456f4ece0646675f63a775d50d7c9117f59
          - lane: js-u64
            repo: atto-source.js
            head: a44f3ea6a397d6db99babd0aebdd018842b9f93a
            tree: 680899ffe367b9bed6d8b530b144e654498f5938
          - lane: spec
            repo: atto-spec
            head: aae2f21d934b743f7f24dac2933046d8711b4a03
            tree: 7fb3cba28efb8e8069afb44ffe19537a07ebc0fe
    steps:
      - name: Fetch only public exact Git source with no credentials
        env:
          SOURCE_REPO: ${{ matrix.repo }}
          SOURCE_HEAD: ${{ matrix.head }}
          SOURCE_TREE: ${{ matrix.tree }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_HEAD" =~ ^[a-f0-9]{40}$ && "$SOURCE_TREE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_REPO" =~ ^atto-(source\.(rs|js)|format|spec)$ ]]
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          mkdir source
          git -C source init -q
          git -C source -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 "https://github.com/atto-lang/$SOURCE_REPO.git" "$SOURCE_HEAD"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git -C source diff --quiet HEAD --
          test -z "$(git -C source ls-files --others --exclude-standard)"
          test -z "$(git -C source ls-files --others --ignored --exclude-standard)"
          echo "VERIFIED_SOURCE_HEAD=$SOURCE_HEAD"
          echo "VERIFIED_SOURCE_TREE=$SOURCE_TREE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned Rust
        if: matrix.lane == 'rust' || matrix.lane == 'clippy'
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          rustup component add clippy --toolchain 1.85.1
          rustup default 1.85.1
      - name: Execute scoped actual compiler tests
        working-directory: source
        env:
          LANE: ${{ matrix.lane }}
          RUST_MIN_STACK: "16777216"
        shell: bash
        run: |
          set -euo pipefail
          case "$LANE" in
            rust)
              cargo test --locked --test canonical_keyword_conditionals_main --test ternary_explicit_arm
              cargo test --locked
              cargo clippy --locked --all-targets -- -D warnings
              ;;
            clippy)
              cargo clippy --locked --all-targets -- -D warnings
              cargo test --locked
              ;;
            js)
              npm run test:conditionals
              npm run test:conditional-adt
              npm test
              ;;
            js-u64)
              npm test
              npm run check
              ;;
            formatter)
              cargo test --locked --test keyword_guard_regressions
              cargo test --locked
              node --test tests/*.test.mjs
              ;;
            spec)
              node --check tests/conditional-expression-v2-contract.test.mjs
              node --test tests/conditional-expression-v2-contract.test.mjs
              ;;
            *) exit 1 ;;
          esac
          git diff --quiet HEAD --
          echo "SCOPED_EXECUTED_TESTS_COMPLETE=$LANE"
