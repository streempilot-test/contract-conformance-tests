name: Exact public Rust stateless value-loop guest gate
on:
  pull_request:
    paths:
      - '.github/workflows/stateless-value-loop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Authenticate pinned public source
        run: |
          set -euo pipefail
          git init src
          git -C src -c credential.helper= -c http.extraHeader= fetch --depth=1 --no-tags https://github.com/atto-lang/atto-source.rs.git dac71a026e41c47dcfb4c6440aa973a21bbb5ab8
          git -C src checkout --detach FETCH_HEAD
          test "$(git -C src rev-parse HEAD)" = dac71a026e41c47dcfb4c6440aa973a21bbb5ab8
          test "$(git -C src rev-parse HEAD^{tree})" = d2372c34311bdad83941eece0d23c9d233d9e277
          test "$(git -C src write-tree)" = d2372c34311bdad83941eece0d23c9d233d9e277
      - name: Real compiler core and full native/Wasm conformance
        run: |
          set -euo pipefail
          cd src
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          cargo +1.85.1 build --locked --release --bin attoc
          cargo +1.85.1 rustc --locked --release --lib --target wasm32-unknown-unknown --crate-type cdylib -- -C link-arg=--max-memory=67108864
          ATTOC=target/release/attoc node tests/conformance.mjs
          git diff --exit-code
