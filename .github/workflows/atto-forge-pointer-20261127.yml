name: Exact Forge signed pointer native verification
on:
  push:
    branches: ['verify/atto-forge-signed-pointer-20261127']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    env:
      SOURCE_HEAD: 05e73e5ad3563fcaec05ec614b753a1b5c9b4cea
      SOURCE_TREE: c66a7d96fb4de9acee8fdc5203feb3baa4e32bae
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Fetch public source without credentials and verify exact tree
        run: |
          set -euo pipefail
          git init source
          git -C source -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.forge.git "$SOURCE_HEAD"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git -C source rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git -C source diff --exit-code HEAD --
          git -C source fsck --full --no-reflogs
      - name: Compile typed checker and actual native guest emitter with sanitizers
        working-directory: source
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/forge" -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DATTO_FORGE_SANITIZERS=ON
          cmake --build "$RUNNER_TEMP/forge" --parallel 2 --target forge_scalar pointer_local_typed_test reusable_slot_verifier_test physical_layout_test scalar_parser_test
          ctest --test-dir "$RUNNER_TEMP/forge" --output-on-failure -R '^(pointer_local_typed_test|reusable_slot_verifier_test|pointer_local_native_guests|physical_layout_test|scalar_parser_test)$'
      - name: Execute large-catalog native guest and unchanged lexical limits
        working-directory: source
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/quantity"
          mkdir -p "$dir"
          {
            printf '%s\n' 'define dimension Length; define unit Meter: Length;'
            for i in $(seq 0 47); do printf 'define unit Measure%s: Length = Meter * 1;\n' "$i"; done
            printf '%s\n' 'type Positive = int where self > 0; type Negative = int where self < 0;'
            printf '%s\n' 'pub fnc main() -> int {val a=42<Measure47>; return a/1<Measure47>;}'
          } > "$dir/catalog.atto"
          "$RUNNER_TEMP/forge/forge_scalar" "$dir/catalog.atto" -o "$dir/catalog.cpp"
          "$CXX" -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude "$dir/catalog.cpp" -o "$dir/catalog"
          test "$("$dir/catalog")" = 42
          if "$RUNNER_TEMP/forge/forge_scalar" --verify=strict "$dir/catalog.atto" -o "$dir/strict.cpp"; then exit 1; fi
          test ! -e "$dir/strict.cpp"
          sed '$d' "$dir/catalog.atto" > "$dir/oversized.atto"
          {
            printf 'pub fnc main() -> int {return 1'
            for i in $(seq 1 260); do printf '+1'; done
            printf ';}\n'
          } >> "$dir/oversized.atto"
          if "$RUNNER_TEMP/forge/forge_scalar" "$dir/oversized.atto" -o "$dir/oversized.cpp"; then exit 1; fi
          test ! -e "$dir/oversized.cpp"
          echo FORGE_CATALOG_GUEST_PASS
          printf '%s\n' 'pub fnc main() -> int {return 42000<Millimeter>.to_unit<Meter>()/1<Meter>;}' > "$dir/implicit.atto"
          "$RUNNER_TEMP/forge/forge_scalar" "$dir/implicit.atto" -o "$dir/implicit.cpp"
          "$CXX" -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude "$dir/implicit.cpp" -o "$dir/implicit"
          test "$("$dir/implicit")" = 42
          printf '%s\n' 'pub fnc main() -> int {return 42<Meter>/1<Second>;}' > "$dir/bad.atto"
          if "$RUNNER_TEMP/forge/forge_scalar" "$dir/bad.atto" -o "$dir/bad.cpp"; then exit 1; fi
          test ! -e "$dir/bad.cpp"
          echo FORGE_IMPLICIT_GUEST_PASS
          printf '%s\n' 'define dimension Length; define dimension Time; define dimension Speed = Length / Time; define unit Meter: Length; define unit Second: Time; define unit Mps: Speed; pub fnc main() -> int {return 42<Mps>*1<Second>/1<Meter>;}' > "$dir/compound.atto"
          "$RUNNER_TEMP/forge/forge_scalar" "$dir/compound.atto" -o "$dir/compound.cpp"
          "$CXX" -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Iinclude "$dir/compound.cpp" -o "$dir/compound"
          test "$("$dir/compound")" = 42
          printf '%s\n' 'define dimension Length; define dimension Empty = Length / Length; pub fnc main() -> int {return 42;}' > "$dir/empty.atto"
          if "$RUNNER_TEMP/forge/forge_scalar" "$dir/empty.atto" -o "$dir/empty.cpp"; then exit 1; fi
          test ! -e "$dir/empty.cpp"
          echo FORGE_COMPOUND_GUEST_PASS
      - name: Verify source unchanged after tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git -C source diff --exit-code HEAD --
          echo "VERIFIED_AFTER_TEST=$SOURCE_HEAD"
