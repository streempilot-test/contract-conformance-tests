name: Exact public JS compiler recursive Record Array regression
on:
  push:
    branches: [verify/atto-js-dynrecord-computed-20261127]
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GIT_TERMINAL_PROMPT: '0'
      SOURCE_SHA: d97458d1553d45db65deb68d8b590789feea12ae
      SOURCE_TREE: 43c109c285d6f0d2e03381667c86cf3e4236e493
    steps:
      - name: Fetch public source anonymously and verify exact commit and root tree
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/atto-js"
          cd "$RUNNER_TEMP/atto-js"
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.js.git "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git fsck --strict --no-dangling
          git status --porcelain
          printf 'EXACT_PUBLIC_SOURCE %s %s\n' "$SOURCE_SHA" "$SOURCE_TREE"
      - name: Execute focused compiler and generated JS guest tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/atto-js"
          node_dir=$(find /opt/hostedtoolcache/node -mindepth 1 -maxdepth 1 -type d -name '22.*' | sort -V | tail -1)
          test -n "$node_dir"
          export PATH="$node_dir/x64/bin:$PATH"
          node --version
          node --check src/compiler.mjs
          node --test tests/dynrecord-computed-key.test.mjs tests/named-aggregate-type-inference.test.mjs tests/record-array-constexpr-projection.test.mjs tests/named-aggregate-module-scalar.test.mjs tests/named-aggregate-reserved-types.test.mjs tests/scalar-seq-return.test.mjs
      - name: Execute full JS regression and compiler syntax checks
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/atto-js"
          node_dir=$(find /opt/hostedtoolcache/node -mindepth 1 -maxdepth 1 -type d -name '22.*' | sort -V | tail -1)
          test -n "$node_dir"
          export PATH="$node_dir/x64/bin:$PATH"
          npm run check
          npm test
