name: Atto LLVM Wasm NET Forge exact verification
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-llvm-wasm-net-forge.yml']
permissions:
  contents: read
jobs:
  llvm-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify exact public head
        shell: bash
        run: |
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.llvm.git
          git -C source fetch --no-tags --depth=1 origin ecc31853d3c8c4cf57bf5f470a670b3234374427
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "ecc31853d3c8c4cf57bf5f470a670b3234374427"
          git -C source rev-parse 'HEAD^{tree}'
          test "$(git -C source hash-object frontend/src/parser.rs)" = "768b3a8ef82890451c17fde049300fed419b4f0a"
          test "$(git -C source hash-object frontend/src/lexer.rs)" = "4ea70373094ea8f00e1b848c7f5b327a39662a03"
          test "$(git -C source hash-object frontend/src/directed_pipe.rs)" = "c092fd769e85daef8577d22bd04db3aa684aa63f"
          test "$(git -C source hash-object frontend/tests/typed_actor_receives.rs)" = "7c08658a9e56a694d459483a3defbb0762a2ab88"
      - name: Full browser frontend regression
        working-directory: source/frontend
        run: cargo test --locked --all-targets --no-fail-fast
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify exact public head
        shell: bash
        run: |
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.wasm.git
          git -C source fetch --no-tags --depth=1 origin 0cdb935e65d8bfc919be88b4fd114b9fcaca35f9
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "0cdb935e65d8bfc919be88b4fd114b9fcaca35f9"
          git -C source rev-parse 'HEAD^{tree}'
          test "$(git -C source hash-object src/pooled-actor-frame-turn.mjs)" = "5715140d7098f6f649eedc7e30ae3f1b53aeef89"
          test "$(git -C source hash-object src/pooled-actor-host.mjs)" = "4b9f63e92a435f73ee6a484222a1c796a299ae37"
          test "$(git -C source hash-object src/pooled-actor-worker.mjs)" = "5e8e3a5d64fc88e227f4d5dfebefc23d9212766b"
          test "$(git -C source hash-object tests/pooled-managed-frame-worker.test.mjs)" = "531035c8f9170f379c260d84483de1334ac534d5"
          test "$(git -C source hash-object package.json)" = "0a01e1e269278dad5cf0382abb416b9274b5f0b5"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Managed pooled worker integration
        working-directory: source
        run: npm run test:managed-pooled-actors
      - name: Full Node regression
        if: always()
        working-directory: source
        run: npm test
  net:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify exact public head
        shell: bash
        run: |
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.net.git
          git -C source fetch --no-tags --depth=1 origin fe3a9a5f13c6fd70b11fb2c43a8818ceb35635d2
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "fe3a9a5f13c6fd70b11fb2c43a8818ceb35635d2"
          git -C source rev-parse 'HEAD^{tree}'
          test "$(git -C source hash-object runtime/Ores.Net.Runtime/ActorArena.cs)" = "bf6e05c797c1599ff9ad5b5ab85dc37f0312f9bd"
          test "$(git -C source hash-object verification/Ores.Net.Tests/ActorArenaTests.cs)" = "d4cdb82253ae9eebe4460deefd14597b06debc9a"
          test "$(git -C source hash-object verification/Ores.Net.Tests/Ores.Net.Tests.csproj)" = "21965242d483f00abb36928969e5726dfc85849e"
      - name: Verify installed .NET SDK
        working-directory: source
        run: dotnet --version
      - name: Execute actual arena and runtime tests
        working-directory: source
        run: dotnet run --configuration Release --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj
      - name: Publish and execute NativeAOT runtime tests
        working-directory: source
        run: |
          dotnet publish verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release -r linux-x64 -p:PublishAot=true -o "$RUNNER_TEMP/atto-net-tests"
          "$RUNNER_TEMP/atto-net-tests/Ores.Net.Tests"
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify exact public head
        shell: bash
        run: |
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.forge.git
          git -C source fetch --no-tags --depth=1 origin b2acfe0bc8c4af0645ffe488b5ef2007c149f714
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "b2acfe0bc8c4af0645ffe488b5ef2007c149f714"
          git -C source rev-parse 'HEAD^{tree}'
          test "$(git -C source hash-object shared/oreslang/runtime/NativeSelectContinuationFence.hpp)" = "c6a3410890e504a9767f08eb53a99f4bd105648c"
          test "$(git -C source hash-object verification/select_continuation_lease_host.cpp)" = "7582ea3324453678aba559e9e2401d0fab404a86"
          test "$(git -C source hash-object CMakeLists.txt)" = "90052f93e45355cf0ceee675945b75f8e952c606"
      - name: Optimized and sanitizer lifecycle stress
        working-directory: source
        run: |
          for cxx in g++ clang++; do
            "$cxx" -std=c++20 -O2 -pthread -Wall -Wextra -Werror -I. verification/select_continuation_lease_host.cpp -o "$RUNNER_TEMP/lease-test"
            "$RUNNER_TEMP/lease-test"
            "$cxx" -std=c++20 -O1 -g -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -I. verification/select_continuation_lease_host.cpp -o "$RUNNER_TEMP/lease-sanitized"
            "$RUNNER_TEMP/lease-sanitized"
          done
      - name: CMake integration and registered tests
        working-directory: source
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
