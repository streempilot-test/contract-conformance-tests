name: Exact Rust compiler borrow evidence verification
on:
  push:
    branches: ['verify/atto-rust-borrow-export-20261127']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_HEAD: 0f87399e3a627ea7b81227e88e5ce1082008e8bb
      SOURCE_TREE: b874a4a4f0c0e1edf5f8c3d6b5abe3d4385bf109
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Fetch public source and verify exact commit and tree
        run: |
          set -euo pipefail
          git init source
          git -C source -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.rs.git "$SOURCE_HEAD"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git -C source rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git -C source diff --exit-code HEAD --
          git -C source fsck --full --no-reflogs
      - name: Pinned Rust full compiler and borrow evidence regression
        working-directory: source
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component clippy
          cargo +1.85.1 test --locked --test typed_cfg_census
          cargo +1.85.1 test --locked --lib loan_liveness
          cargo +1.85.1 test --locked --test disjoint_field_loan_guest
          cargo +1.85.1 test --locked --test borrow_export_l3
          cargo +1.85.1 test --locked --all-targets
          cargo +1.85.1 clippy --locked --all-targets -- -D warnings
      - name: Verify source unchanged
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git -C source diff --exit-code HEAD --
          echo "VERIFIED_AFTER_TEST=$SOURCE_HEAD"
