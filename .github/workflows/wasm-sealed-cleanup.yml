name: Current-main Wasm sealed workspace cleanup qualification
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
    steps:
      - name: Exact pinned public source trees
        run: |
          set -euo pipefail
          checkout() {
            local repo="$1" sha="$2" tree="$3" dest="$4"
            git init "$dest"
            git -C "$dest" -c credential.helper= -c core.askPass= -c http.extraHeader= fetch --no-tags --depth=1 "https://github.com/atto-lang/$repo.git" "$sha"
            git -C "$dest" checkout --detach FETCH_HEAD
            test "$(git -C "$dest" rev-parse HEAD)" = "$sha"
            test "$(git -C "$dest" rev-parse HEAD^{tree})" = "$tree"
            git -C "$dest" fsck --no-dangling
            test -z "$(git -C "$dest" status --porcelain)"
            printf 'EXACT_SOURCE repo=%s sha=%s tree=%s\n' "$repo" "$sha" "$tree"
          }
          checkout atto-source.wasm e08f1133271dbfa1f80034d91e73e2fa86198876 7c88bb82f9dfc163032a7ddda777ec9a0809a255 source
          checkout atto-source.llvm e43938a919ef56153b3f96cf14a57d5ea6781be4 08c5b3fa67a0ee0b78044d321849296e6fb1f179 llvm-source
      - name: Build actual compiler and run repaired seven-suite corpus
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y llvm-dev clang lld ninja-build
          cmake -S llvm-source -B llvm-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build llvm-build --target oreslang-llvmc --parallel 2
          export ORESLANG_LLVM_SOURCE_SHA=e43938a919ef56153b3f96cf14a57d5ea6781be4
          export ORESLANG_LLVM_SOURCE_TREE=08c5b3fa67a0ee0b78044d321849296e6fb1f179
          export ORESLANG_LLVM_COMPILER="$PWD/llvm-build/oreslang-llvmc"
          export ORESLANG_LLVM_COMPILER_SHA256="$(sha256sum "$ORESLANG_LLVM_COMPILER" | cut -d ' ' -f1)"
          export ORESLANG_REQUIRE_REAL_COMPILER=1
          cd source
          node --test tests/atto-semantic-negative-wasm32.test.mjs tests/canonical-no-percent-real-guest.test.mjs tests/native-scalar-zero-parity.test.mjs tests/numeric-source-parity.test.mjs tests/portable-scalar-parity-v1.test.mjs tests/portable-scalar-parity-v2.test.mjs tests/unary-plus-source-parity.test.mjs
          echo SCOPE=REAL_COMPILER_WORKSPACE_CLEANUP_AND_SCOPED_GUEST_REGRESSION
