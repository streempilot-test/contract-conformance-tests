name: Atto arena policy real guests
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-arena-policy-guests-20261127.yml']
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: rs
            head: c2dce3c359130d136214af9b89d6c11786651f78
          - backend: js
            head: 045f7f77bcd886eca18c681ea1471f0ac16f5c02
    steps:
      - name: Fetch exact public source
        env:
          BACKEND: ${{ matrix.backend }}
          HEAD_SHA: ${{ matrix.head }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 "https://github.com/atto-lang/atto-source.$BACKEND.git" "$HEAD_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$HEAD_SHA"
          git -C source rev-parse HEAD^{tree}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile real Rust frontend and execute Wasm policy
        if: matrix.backend == 'rs'
        shell: bash
        run: |
          set -euo pipefail
          cd source
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 build --locked --release --bin attoc
          ATTOC="$PWD/target/release/attoc" node tests/arena-quota-lifecycle-guest.mjs
          git diff --exit-code
      - name: Compile real JavaScript frontend and execute ESM policy
        if: matrix.backend == 'js'
        shell: bash
        run: |
          set -euo pipefail
          cd source
          node --test tests/arena-quota-lifecycle-guest.test.mjs
          git diff --exit-code
