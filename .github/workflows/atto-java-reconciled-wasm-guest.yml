name: Atto reconciled Java and real WASM supervisor guest
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  wasm-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify exact public source
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          git init atto-source.llvm
          git -C atto-source.llvm -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.llvm.git 511829067db67547d412e5b4d34d16d6128b1e82
          git -C atto-source.llvm -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
          test "$(git -C atto-source.llvm rev-parse HEAD)" = 511829067db67547d412e5b4d34d16d6128b1e82
          test "$(git -C atto-source.llvm write-tree)" = "$(git -C atto-source.llvm rev-parse 'HEAD^{tree}')"
          test "$(git -C atto-source.llvm hash-object tests/source_actor_e2e.py)" = 28b9a65e2c25db53997935964ee3365a351574ff
          test "$(git -C atto-source.llvm hash-object src/main/cpp/oreslang/runtime/SourceActorBootstrap.c)" = a29d6cbe526ccf51992e3699e1081e45e33da395
          git -C atto-source.llvm diff --exit-code HEAD
          git -C atto-source.llvm rev-parse HEAD 'HEAD^{tree}'
      - name: Select LLVM 18 development toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v llvm-config-18 || ! command -v clang-18 || ! test -f "$(llvm-config-18 --cmakedir)/LLVMConfig.cmake"; then
            sudo apt-get update
            sudo apt-get install -y llvm-18-dev clang-18 libclang-rt-18-dev
          fi
          llvm-config-18 --version
          clang-18 --version
      - name: Build compiler and execute actual actor guests
        shell: bash
        working-directory: atto-source.llvm
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/atto-llvm-build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DLLVM_DIR="$(llvm-config-18 --cmakedir)"
          cmake --build /tmp/atto-llvm-build --target oreslang-llvmc -j2
          test -x /tmp/atto-llvm-build/oreslang-llvmc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute mandatory compiled WASM supervisor fixture
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          git init atto-source.wasm
          git -C atto-source.wasm -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.wasm.git bcc7795d83f75e466dcf071485dcc365b4b5ac48
          git -C atto-source.wasm -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
          test "$(git -C atto-source.wasm rev-parse HEAD)" = bcc7795d83f75e466dcf071485dcc365b4b5ac48
          test "$(git -C atto-source.wasm write-tree)" = "$(git -C atto-source.wasm rev-parse 'HEAD^{tree}')"
          test "$(git -C atto-source.wasm hash-object tests/supervised-pooled-actor-v1.test.mjs)" = cf360d7f42178737df29c3190bc03c776d42191e
          test "$(git -C atto-source.wasm hash-object contracts/actor-stack-containment-v1/recursive-sibling.atto)" = 947781cddf09d8e3e08c51cff2b7d8960e2d4750
          export ORESLANG_LLVM_COMPILER=/tmp/atto-llvm-build/oreslang-llvmc
          export ORESLANG_LLVM_COMPILER_SHA256="$(sha256sum "$ORESLANG_LLVM_COMPILER" | cut -d' ' -f1)"
          export ORESLANG_LLVM_SOURCE_SHA="$(git -C atto-source.llvm rev-parse HEAD)"
          export ORESLANG_LLVM_SOURCE_TREE_SHA="$(git -C atto-source.llvm rev-parse 'HEAD^{tree}')"
          export CLANG=clang-18
          export ATTO_REQUIRE_REAL_SUPERVISOR_GUEST=1
          cd atto-source.wasm
          npm run test:real-supervisor-guest
  java-reconciled:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify exact public source
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          git init atto-source.java
          git -C atto-source.java -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.java.git refs/heads/integration/continuation-retirement-current-main-20261127
          git -C atto-source.java -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
          test "$(git -C atto-source.java rev-parse HEAD)" = b0afbe59e7a5e2b3b75838dd1cf03b89acdaf59a
          test "$(git -C atto-source.java write-tree)" = "$(git -C atto-source.java rev-parse 'HEAD^{tree}')"
          test "$(git -C atto-source.java hash-object 'src/main/java/dev/oreslang/runtime/ActorRuntime.java')" = 69a5641a5b79ac080c5e48972c11ca7c56441c51
          test "$(git -C atto-source.java hash-object 'src/main/java/dev/oreslang/runtime/ActorContinuationLedger.java')" = 2df2c570b295cbf6f532e7ba2c7a30e48ffd5f73
          test "$(git -C atto-source.java hash-object 'src/test/java/dev/oreslang/runtime/ActorContinuationLedgerTest.java')" = 21393f60ea168c6fccf4b5e233a1c728b1de81fc
          test "$(git -C atto-source.java hash-object 'src/test/java/dev/oreslang/runtime/SettlementProbe.java')" = 668b3b353e379a1d52865ea1380dbde9b06c3096
      - name: Compile and run Java lifecycle regressions
        shell: bash
        working-directory: atto-source.java
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          mvn -B -ntp -Dtest=ActorContinuationLedgerTest test
