name: Exact four-family value-loop receipt registry
on:
  pull_request:
    paths:
      - '.github/workflows/value-loop-observations-707.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Authenticate exact public source and execute registry tests
        run: |
          set -euo pipefail
          git init src
          git -C src -c credential.helper= -c http.extraHeader= fetch --depth=1 --no-tags https://github.com/atto-lang/atto-platform-conformance.git 969a009bf42b3a937f60a6b988f9ec6c1ed843ce
          git -C src checkout --detach FETCH_HEAD
          test "$(git -C src rev-parse HEAD)" = 969a009bf42b3a937f60a6b988f9ec6c1ed843ce
          test "$(git -C src write-tree)" = 8f482da9c4f2b524e0370379bde88f65a66e7e88
          cd src
          node --test tests/value-loop-recur-targets.test.mjs tests/value-loop-recur-observations-v1.test.mjs tests/value-loop-recur-observations-v2.test.mjs
          git diff --exit-code
