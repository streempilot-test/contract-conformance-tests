name: Java exact FFM control arena
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/atto-java-control-arena-20261127.yml'
permissions:
  contents: read
jobs:
  java-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact public source without credentials
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.java.git 54868d92a9627f23611e1b2d5f3836cca69d6098
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 54868d92a9627f23611e1b2d5f3836cca69d6098
          git -C source rev-parse HEAD^{tree}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile FFM host arena and measure warmed JVM allocation
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -Xlint:all -Werror -d "$RUNNER_TEMP/java-control" source/verification/control-plane-arena-v1/*.java
          java -cp "$RUNNER_TEMP/java-control" ControlPlaneArenaProbe
          git -C source diff --exit-code
