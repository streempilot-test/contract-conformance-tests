name: Atto CLR arena policy real guest
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-arena-policy-clr-20261127.yml']
permissions:
  contents: read
jobs:
  clr:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch exact public source
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.net.git c38365407850c95f90e4c413a64c9813c2184eb4
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = c38365407850c95f90e4c413a64c9813c2184eb4
          git -C source rev-parse HEAD^{tree}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile and execute CIL policy guest
        shell: bash
        run: |
          set -euo pipefail
          cd source
          dotnet run -c Release --project verification/Ores.Net.ArenaPolicyGuestProbe/Ores.Net.ArenaPolicyGuestProbe.csproj
          git diff --exit-code
