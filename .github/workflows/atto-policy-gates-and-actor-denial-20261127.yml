name: Atto policy gates and actor denial
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-policy-gates-and-actor-denial-20261127.yml']
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch exact public source
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.rs.git d2bcc72559329be3fbe4e6917bbb9bf6173d8650
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = d2bcc72559329be3fbe4e6917bbb9bf6173d8650
          git -C source rev-parse HEAD^{tree}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          set -euo pipefail
          cd source
          test "$(git hash-object tests/arena-policy-differential-v1.mjs)" = f98055af7bb9b8952664946d2b2a1f3a735dc283
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 build --locked --release --bin attoc
          ATTOC="$PWD/target/release/attoc" node tests/arena-quota-lifecycle-guest.mjs
  net:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Fetch exact public source
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.net.git 1e250112341aeff539e849017182484c654473ff
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 1e250112341aeff539e849017182484c654473ff
          git -C source rev-parse HEAD^{tree}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd source && bash verification/Ores.Net.ArenaPolicyGuestProbe/run-nativeaot-policy.sh
  cranelift:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch exact public source
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.cranelift.git eef1590b570e3c7e6fc9321bc8cae7c81fe07295
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = eef1590b570e3c7e6fc9321bc8cae7c81fe07295
          git -C source rev-parse HEAD^{tree}
      - run: cd source && cargo test --locked --test cli actor_declarations_fail_closed_before_cranelift_ir_or_native_jit -- --nocapture
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Fetch exact public source
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.java.git 1cf9cd79ebf7c14befc814bdad0c276c0efda38f
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 1cf9cd79ebf7c14befc814bdad0c276c0efda38f
          git -C source rev-parse HEAD^{tree}
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - run: cd source && mvn -B -Dtest=ArenaPolicyCompiledGuestTest test
