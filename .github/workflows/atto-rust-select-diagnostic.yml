name: Atto Rust exact-tree diagnostic compiler and guest
on:
  push:
    branches: [ci/atto-rust-select-diagnostic-20261126]
permissions:
  contents: read
jobs:
  exact-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Verify exact public commit and tree
        env:
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        shell: bash
        run: |
          set -euo pipefail
          git init source
          cd source
          git -c credential.helper= fetch --depth=1 --no-tags https://github.com/atto-lang/atto-source.rs.git 57890f52eae7e2db6f0fefc6117f18abc65c0318
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 57890f52eae7e2db6f0fefc6117f18abc65c0318
          test "$(git rev-parse HEAD^{tree})" = 76312372c999d4eae6b4c904927b96d08447fde1
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned Rust
        run: rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown --component rustfmt --component clippy
      - name: Compiler and select regression diagnostics, not promotion
        id: diagnostic
        working-directory: source
        run: |
          set -euo pipefail
          cargo +1.85.1 test --locked --test v2_select_plans
          cargo +1.85.1 build --locked --bin attoc
          node tests/node-v2-select-plans-guest.mjs
      - name: Required strict formatter gate (not waived)
        if: always() && steps.diagnostic.outcome != 'skipped'
        working-directory: source
        run: cargo +1.85.1 fmt --all -- --check
