name: Cranelift current-main and standalone Wasm native/browser parity
on:
  push:
    branches: [ci/cranelift-current-main-and-wasm-native-parity-20261127]
    paths: [.github/workflows/cranelift-current-main-and-wasm-native-parity.yml]
permissions: {}
jobs:
  cranelift:
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: '196'
            head: '21f66f8f5a74359a5da4f46abbd94b9fe1f1246c'
            tree: 'd68d1ecadd932f210fb17f8e61a7217e233c0f8c'
          - pr: '204'
            head: '7e5cf07ca2bff0881a1156f1de2ed5d30c0ffa86'
            tree: '7b7882a56b987abdd6dc21c6151a8639fee74015'
          - pr: '208'
            head: '78f5f382b8c74413912a480fc5f38477331d9821'
            tree: '3b6f4054178326fd51905cf6ff957a57d69b3cc1'
          - pr: '210'
            head: 'a492ed0deb07d6deaabc91fc1b0732badf2ee8b6'
            tree: '88d9c187f7cb13942f5598cbcefd88fe7ab09818'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Verify pinned source and construct current-main integration
        env:
          HEAD_SHA: ${{ matrix.head }}
          HEAD_TREE: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          git init -q source
          cd source
          git -c credential.helper= -c http.extraHeader= fetch --no-tags https://github.com/atto-lang/atto-source.cranelift.git 03687ce0cbf2e1f42a04b555d0c3e985f6a4ce24 "$HEAD_SHA"
          test "$(git rev-parse '03687ce0cbf2e1f42a04b555d0c3e985f6a4ce24^{tree}')" = 454d6861be37c64e0ffdcaaefdb5dcaa074c8bf2
          test "$(git rev-parse "$HEAD_SHA^{tree}")" = "$HEAD_TREE"
          git checkout --detach 03687ce0cbf2e1f42a04b555d0c3e985f6a4ce24
          git -c user.name=CI -c user.email=ci@example.invalid merge --no-commit --no-ff "$HEAD_SHA"
          git diff --quiet --
          test -z "$(git ls-files -u)"
          git write-tree > "$RUNNER_TEMP/integration-tree"
          echo "INTEGRATION_TREE=$(cat "$RUNNER_TEMP/integration-tree")"
      - name: Execute linked native placement and full regression
        working-directory: source
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 test --locked --test ownership_bang_admission -- --nocapture
          cargo +1.99.1 test --locked physical_layout -- --nocapture
          cargo +1.99.1 test --locked
          git diff --quiet --
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/integration-tree")"
          echo "EXECUTED_INTEGRATION_TREE=$(git write-tree)"
  real-wasm-actor:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Fetch and verify exact current public LLVM and Wasm source trees
        run: |
          set -euo pipefail
          clone_exact() {
            local repo="$1" head="$2" tree="$3" dst="$4"
            git init -q "$dst"
            git -C "$dst" -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 "https://github.com/atto-lang/$repo.git" "$head"
            git -C "$dst" checkout --detach FETCH_HEAD
            test "$(git -C "$dst" rev-parse HEAD)" = "$head"
            test "$(git -C "$dst" rev-parse 'HEAD^{tree}')" = "$tree"
            git -C "$dst" diff --exit-code HEAD --
          }
          clone_exact atto-source.llvm 0b953417f002919dec5dc129e8c97428bd2d3900 8b7b45a3cfb5babdbf848dde545686eb1771f098 compiler
          clone_exact atto-source.wasm 4feda3bdf7a134ca8795a2a232a678fb144fa454 43901e306c68ea9aaf57e0233f57f20aee9b0632 host
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Execute actual host frame and retirement controls
        working-directory: host
        run: |
          set -euo pipefail
          node --test tests/actor-frame-stacks.test.mjs tests/actor-frame-stack-primordials.test.mjs tests/actor-arena-primordial-scrub.test.mjs tests/pooled-actors.test.mjs tests/real-pooled-gate-admission.test.mjs
      - name: Build genuine native LLVM source compiler
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y llvm-18-dev clang-18 lld-18
          cmake -S compiler -B "$RUNNER_TEMP/compiler-build" -DLLVM_DIR="$(llvm-config-18 --cmakedir)" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/compiler-build" --target oreslang-llvmc --parallel 2
      - name: Execute mandatory real pooled actor guest gate
        working-directory: host
        run: |
          set -euo pipefail
          export ORESLANG_LLVM_COMPILER="$RUNNER_TEMP/compiler-build/oreslang-llvmc"
          export ORESLANG_LLVM_COMPILER_SHA256="$(sha256sum "$ORESLANG_LLVM_COMPILER" | cut -d ' ' -f1)"
          export CLANG=clang-18
          echo "COMPILER_SHA256=$ORESLANG_LLVM_COMPILER_SHA256"
          npm run test:real-pooled-actors | tee "$RUNNER_TEMP/pooled.log"
          grep -Fx 'REAL_POOLED_ACTOR_TESTS_VERIFIED=3; SKIPPED=0; WORKERS=2; ACTORS=40; TURNS=1000' "$RUNNER_TEMP/pooled.log"
          git diff --exit-code HEAD --
          echo "EXECUTED_HOST_TREE=$(git rev-parse 'HEAD^{tree}')"
  browser-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Verify exact current host and its required compiler and fixture pins
        run: |
          set -euo pipefail
          clone_exact() {
            local repo="$1" head="$2" tree="$3" dst="$4"
            git init -q "$dst"
            git -C "$dst" -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 "https://github.com/atto-lang/$repo.git" "$head"
            git -C "$dst" checkout --detach FETCH_HEAD
            test "$(git -C "$dst" rev-parse HEAD)" = "$head"
            test "$(git -C "$dst" rev-parse 'HEAD^{tree}')" = "$tree"
            git -C "$dst" diff --exit-code HEAD --
          }
          clone_exact atto-source.wasm 4feda3bdf7a134ca8795a2a232a678fb144fa454 43901e306c68ea9aaf57e0233f57f20aee9b0632 host
          clone_exact atto-source.rs c2ff8e8369e398eee018db1a1c1f45f27bcda428 910e12faf393e3503f5913cfb289066ffa7214c4 compiler
          clone_exact atto-platform-conformance c196a575dc5249f57c013013d384ad0b8b02309c bac51327d3fc9c53afd0c0bead885f3e9c5240ae fixtures
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build actual wasm32 compiler
        working-directory: compiler
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          cargo +1.85.1 rustc --locked --release --lib --target wasm32-unknown-unknown --crate-type cdylib -- -C link-arg=--max-memory=67108864
      - name: Execute shared attached-struct Wasm and ESM browser ABI guests
        working-directory: host
        run: |
          set -euo pipefail
          export ATTO_BROWSER_SOURCE_ROOT="$(realpath ../compiler)"
          export ATTO_STRUCT_FIXTURE_ROOT="$(realpath ../fixtures)"
          export ATTO_BROWSER_COMPILER="$ATTO_BROWSER_SOURCE_ROOT/target/wasm32-unknown-unknown/release/atto_compiler.wasm"
          test -s "$ATTO_BROWSER_COMPILER"
          export ATTO_BROWSER_COMPILER_SHA256="$(sha256sum "$ATTO_BROWSER_COMPILER" | cut -d ' ' -f1)"
          npm run test:attached-struct-browser | tee "$RUNNER_TEMP/browser.log"
          test "$(grep -c BROWSER_ATTACHED_STRUCT_RECEIPT "$RUNNER_TEMP/browser.log")" = 2
          git diff --exit-code HEAD --
          echo "EXECUTED_HOST_TREE=$(git rev-parse 'HEAD^{tree}')"
