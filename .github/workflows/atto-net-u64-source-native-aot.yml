name: Atto exact unsigned source NativeAOT execution
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-net-u64-source-native-aot.yml']
permissions:
  contents: read
jobs:
  net-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Verify exact public source
        run: |
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.net.git
          git -C source fetch --no-tags --depth=1 origin 0faa022ffa768ee9df5b87ff4b88b85a60d071a9
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 0faa022ffa768ee9df5b87ff4b88b85a60d071a9
          test "$(git -C source rev-parse 'HEAD^{tree}')" = 875fef13500e174b8c76ae8994f11ab2201a4813
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Native toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y clang zlib1g-dev binutils
      - name: Focused unsigned source admission and IR validation
        working-directory: source
        run: dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release -- --unsigned-ir
      - name: Actual source to statically linked NativeAOT guest execution
        working-directory: source
        run: bash verification/UnsignedNativeAot/run.sh
      - name: Full managed regression
        if: always()
        working-directory: source
        run: dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release
