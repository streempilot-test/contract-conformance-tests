name: Browser flat copy and Java snapshot generation exact tests
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/copy-browser-java-generations.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch anonymous exact public compiler and corpus
        run: |
          set -euo pipefail
          git init compiler
          git -C compiler -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.llvm.git 8ca5e27bc745db89932e2090fb40e632aab46b54
          git -C compiler checkout --detach FETCH_HEAD
          test "$(git -C compiler rev-parse HEAD)" = 8ca5e27bc745db89932e2090fb40e632aab46b54
          test "$(git -C compiler rev-parse HEAD^{tree})" = 5d9237cc6b51501f0d9d95092675860796427b0f
          test "$(git -C compiler write-tree)" = 5d9237cc6b51501f0d9d95092675860796427b0f
      - name: Build actual compiler and execute focused copy guests and regressions
        working-directory: compiler/frontend
        run: |
          set -euo pipefail
          cargo build --locked --bin attoc
          node tests/copy_modes_guest.mjs
          cargo test --locked --lib
          cargo test --locked --test struct_with_members_target
          node tests/struct_with_value_guest.mjs
          rustup target add wasm32-unknown-unknown
          cargo build --locked --release --target wasm32-unknown-unknown --lib
  native-llvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify exact native compiler tree and run real guests
        run: |
          set -euo pipefail
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.llvm.git 8ca5e27bc745db89932e2090fb40e632aab46b54
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 8ca5e27bc745db89932e2090fb40e632aab46b54
          test "$(git -C source rev-parse HEAD^{tree})" = 5d9237cc6b51501f0d9d95092675860796427b0f
          test "$(git -C source write-tree)" = 5d9237cc6b51501f0d9d95092675860796427b0f
          cd source
          bash ci/test_native_copy_modes.sh
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Fetch and pin exact public Java source
        run: |
          set -euo pipefail
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.java.git 8dbc69df39638ce58876e496564ca08615474dcf
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 8dbc69df39638ce58876e496564ca08615474dcf
          test "$(git -C source rev-parse HEAD^{tree})" = 4f34ae5903af6019ca8f8e1a22f0dee5f63dfc63
          test "$(git -C source write-tree)" = 4f34ae5903af6019ca8f8e1a22f0dee5f63dfc63
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
      - name: Run strict snapshot component and targeted JUnit
        working-directory: source
        run: |
          set -euo pipefail
          javac -Xlint:all -Werror -d "$RUNNER_TEMP/snapshot" src/main/java/dev/oreslang/types/GuestClassSlots.java src/main/java/dev/oreslang/types/CopyScalarAdmission.java tests/graph-topology-host/ShallowSnapshotHarness.java
          java -Xss256k -cp "$RUNNER_TEMP/snapshot" ShallowSnapshotHarness
          mvn -B -ntp -Dtest=DerivedCopyPlanGuestTest,CopyPolicyCompilerTest,OwnershipAndClosureTest,DerivedGraphCopyPlanTest,GraphCopyTransactionTest,CopyPlanCacheTest,GuestClassGraphLeaseTest -DfailIfNoTests=true -Dsurefire.failIfNoSpecifiedTests=true test
  corpus:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify latest public fixture tree and run registry tests
        run: |
          set -euo pipefail
          git init corpus
          git -C corpus -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-platform-conformance.git 3631b3e941e449c8d38d3697d4a6d50d11b045f0
          git -C corpus checkout --detach FETCH_HEAD
          test "$(git -C corpus rev-parse HEAD)" = 3631b3e941e449c8d38d3697d4a6d50d11b045f0
          test "$(git -C corpus rev-parse HEAD^{tree})" = 70bf20ffa05c0ecd703a72923d852237a2465244
          test "$(git -C corpus write-tree)" = 70bf20ffa05c0ecd703a72923d852237a2465244
          cd corpus
          node --test tests/copy-readonly-sharing-v1.test.mjs tests/copy-readonly-rust-wasm-runner.test.mjs
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch exact public current-main Rust copy candidate
        run: |
          set -euo pipefail
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.rs.git bcea1f2feca14a13f1675ef53ad850637cd92d34
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = bcea1f2feca14a13f1675ef53ad850637cd92d34
          test "$(git -C source rev-parse HEAD^{tree})" = ddcacbe30f1c17ba53b1afac077fd22a8fc8e496
          test "$(git -C source write-tree)" = ddcacbe30f1c17ba53b1afac077fd22a8fc8e496
      - name: Execute copy and current-main ownership regressions
        working-directory: source
        run: |
          set -euo pipefail
          cargo test --locked --test copy_doublebang
          cargo build --locked --bin attoc
          node tests/copy_doublebang_guest.mjs
          cargo test --locked --lib
          rustup target add wasm32-unknown-unknown
          cargo build --locked --release --target wasm32-unknown-unknown --lib
  shared-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: atto-source.rs
            head: bcea1f2feca14a13f1675ef53ad850637cd92d34
            tree: ddcacbe30f1c17ba53b1afac077fd22a8fc8e496
            subdir: .
          - repo: atto-source.llvm
            head: 8ca5e27bc745db89932e2090fb40e632aab46b54
            tree: 5d9237cc6b51501f0d9d95092675860796427b0f
            subdir: frontend
    steps:
      - name: Verify exact compiler and corpus source trees
        env:
          REPO: ${{ matrix.repo }}
          HEAD_SHA: ${{ matrix.head }}
          TREE_SHA: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          git init compiler
          git -C compiler -c credential.helper= fetch --no-tags --depth=1 "https://github.com/atto-lang/${REPO}.git" "$HEAD_SHA"
          git -C compiler checkout --detach FETCH_HEAD
          test "$(git -C compiler rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git -C compiler rev-parse HEAD^{tree})" = "$TREE_SHA"
          test "$(git -C compiler write-tree)" = "$TREE_SHA"
          git init corpus
          git -C corpus -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-platform-conformance.git 3631b3e941e449c8d38d3697d4a6d50d11b045f0
          git -C corpus checkout --detach FETCH_HEAD
          test "$(git -C corpus rev-parse HEAD)" = 3631b3e941e449c8d38d3697d4a6d50d11b045f0
          test "$(git -C corpus rev-parse HEAD^{tree})" = 70bf20ffa05c0ecd703a72923d852237a2465244
          test "$(git -C corpus write-tree)" = 70bf20ffa05c0ecd703a72923d852237a2465244
      - name: Actual compiled portable corpus (failure is not a pass)
        env:
          HEAD_SHA: ${{ matrix.head }}
          TREE_SHA: ${{ matrix.tree }}
          SUBDIR: ${{ matrix.subdir }}
        run: |
          set -euo pipefail
          ROOT="$(realpath compiler)"
          (cd "$ROOT/$SUBDIR" && cargo build --locked --bin attoc)
          cd corpus
          node scripts/run-copy-readonly-rust-wasm-v1.mjs "$ROOT" "$ROOT/$SUBDIR/target/debug/attoc" "$HEAD_SHA" "$TREE_SHA" 3631b3e941e449c8d38d3697d4a6d50d11b045f0 70bf20ffa05c0ecd703a72923d852237a2465244
