name: Atto protected state exact public source qualification
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-protected-state-exact.yml']
permissions:
  contents: read
jobs:
  rust-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify exact public source commit and tree
        run: |
          set -euo pipefail
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.rs.git
          git -C source fetch --no-tags --depth=1 origin 7bcb557a8441fe55f04e5d7327da6ad583e9d853
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 7bcb557a8441fe55f04e5d7327da6ad583e9d853
          test "$(git -C source rev-parse 'HEAD^{tree}')" = 33d22d47db92573b127aba178c316f23d050c935
          git -C source rev-parse HEAD 'HEAD^{tree}'
      - name: Install source-pinned compiler toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.85.1
      - name: Independent protected typed IR mutation tests
        working-directory: source
        run: cargo test --locked --test state_ir_contract -- --nocapture
      - name: Actual native compiler and protected Wasm guests
        working-directory: source
        run: |
          cargo build --locked --release --bin attoc
          ATTOC=target/release/attoc node tests/state_snapshot_guest.mjs
          ATTOC=target/release/attoc node tests/state_write_expression_guest.mjs
      - name: Whole compiler regression
        if: always()
        working-directory: source
        env:
          RUST_MIN_STACK: "16777216"
        run: cargo test --locked --no-fail-fast
  llvm-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify exact public source commit and tree
        run: |
          set -euo pipefail
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.llvm.git
          git -C source fetch --no-tags --depth=1 origin 08aceb74a97db11ec163fbd958cc474ab8f35bfa
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 08aceb74a97db11ec163fbd958cc474ab8f35bfa
          test "$(git -C source rev-parse 'HEAD^{tree}')" = 0c18170858a7c48171b61ace67623f03eabdf724
          git -C source rev-parse HEAD 'HEAD^{tree}'
      - name: Install source-pinned native toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          clang --version
      - name: Native protected actor guest and no-artifact negatives
        working-directory: source
        run: cargo test --locked --test state_intrinsic_native -- --nocapture
      - name: Native actor regression
        if: always()
        working-directory: source
        run: bash ci/test_native_actors.sh
  net-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify exact public source commit and tree
        run: |
          set -euo pipefail
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.net.git
          git -C source fetch --no-tags --depth=1 origin 4f82bf614789afdf76610c8b4bc378573ff37297
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 4f82bf614789afdf76610c8b4bc378573ff37297
          test "$(git -C source rev-parse 'HEAD^{tree}')" = 6b18c0414f0050c481db4c912ed0190f09edcf59
          git -C source rev-parse HEAD 'HEAD^{tree}'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Full managed compiler and actor runtime suite including owned schema snapshots
        working-directory: source
        run: dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj -c Release
      - name: Publish and execute static Counter NativeAOT guest
        working-directory: source
        run: |
          set -euo pipefail
          dotnet publish verification/Ores.Net.CounterMainV2Guest/Ores.Net.CounterMainV2Guest.csproj -c Release -r linux-x64 -p:PublishAot=true -p:SelfContained=true -o "$RUNNER_TEMP/counter-native"
          binary="$RUNNER_TEMP/counter-native/Ores.Net.CounterMainV2Guest"
          file "$binary"
          test "$(timeout 30s "$binary")" = '1|3|6|10'
          sha256sum "$binary"
  rust-u64-integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify public integrated candidate commit and tree
        run: |
          set -euo pipefail
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.rs.git
          git -C source fetch --no-tags --depth=1 origin 9d8705dba974111597b7a0535b2a1b6717f2bf73
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 9d8705dba974111597b7a0535b2a1b6717f2bf73
          test "$(git -C source rev-parse 'HEAD^{tree}')" = 1b330d1fb2c9c2571f00c4c5569805464ee236ba
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Actual unsigned native guest execution
        working-directory: source/native
        run: ulimit -c 0; cargo test --locked --test checked_u64_native -- --nocapture
      - name: Full native regression
        if: always()
        working-directory: source/native
        run: ulimit -c 0; cargo test --locked --all-targets --no-fail-fast
      - name: Format and strict lint
        if: always()
        working-directory: source/native
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        if: always()
        working-directory: source/native
        run: cargo clippy --locked --all-targets -- -D warnings
