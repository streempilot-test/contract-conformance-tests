name: Atto exact cross-backend checked u64 and callable qualification
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-u64-cross-backend.yml']
permissions:
  contents: read
jobs:
  llvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify exact public source
        run: |
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.llvm.git
          git -C source fetch --no-tags --depth=1 origin c0b56b01eae6da0b7552aaf568a9812e14e6a7f8
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = c0b56b01eae6da0b7552aaf568a9812e14e6a7f8
          test "$(git -C source rev-parse 'HEAD^{tree}')" = 2de583cff9d880e5e5429592666f0b4ec441e553
          test "$(git -C source hash-object contracts/atto-xo-checked-u64-debit-v1/cases.tsv)" = 2d41ae576d049ed3a8898c3deacc8d30c705dce8
          test "$(git -C source hash-object tests/native_task_borrow_rejection.rs)" = af491d1b2dc337ecd1b40c217a1f838410032210
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Actual focused guest or native object execution
        working-directory: source
        run: ulimit -c 0; node --test tests/checked_u64_native_wasm.test.mjs
      - name: Full backend regression
        if: always()
        working-directory: source
        run: |
          cargo test --manifest-path frontend/Cargo.toml --locked --all-targets --no-fail-fast
          sudo apt-get update -qq && sudo apt-get install -y llvm-18-dev clang-18 lld-18
          CC=clang-18 CXX=clang++-18 cmake -S . -B "$RUNNER_TEMP/llvm-build" -DLLVM_DIR="$(llvm-config-18 --cmakedir)" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build "$RUNNER_TEMP/llvm-build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/llvm-build" --output-on-failure
