name: Atto exact cross-backend checked u64 and callable qualification
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-u64-cross-backend.yml']
permissions:
  contents: read
jobs:
  llvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify exact public source
        run: |
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.llvm.git
          git -C source fetch --no-tags --depth=1 origin a733339c135b9796098fe4717d3d4ba41ac7762f
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = a733339c135b9796098fe4717d3d4ba41ac7762f
          test "$(git -C source rev-parse 'HEAD^{tree}')" = 69be0c1e8c4a9ebe9e979ba23791e48d87c045bd
          test "$(git -C source hash-object contracts/atto-xo-checked-u64-debit-v1/cases.tsv)" = 2d41ae576d049ed3a8898c3deacc8d30c705dce8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Actual focused guest or native object execution
        working-directory: source
        run: ulimit -c 0; node --test tests/checked_u64_native_wasm.test.mjs
      - name: Full backend regression
        if: always()
        working-directory: source
        run: |
          cargo test --manifest-path frontend/Cargo.toml --locked --all-targets --no-fail-fast
          sudo apt-get update -qq && sudo apt-get install -y llvm-18-dev clang-18 lld-18
          cmake -S . -B "$RUNNER_TEMP/llvm-build" -DLLVM_DIR="$(llvm-config-18 --cmakedir)" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build "$RUNNER_TEMP/llvm-build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/llvm-build" --output-on-failure
  cranelift:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify exact public source
        run: |
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.cranelift.git
          git -C source fetch --no-tags --depth=1 origin 13f6765227bc730e628ed407bee49a645e5b7d21
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 13f6765227bc730e628ed407bee49a645e5b7d21
          test "$(git -C source rev-parse 'HEAD^{tree}')" = d8fa32ba6c15bf1ffb402548afca50d6a17c6767
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Actual focused guest or native object execution
        working-directory: source
        run: cargo test --locked --test checked_u64_aot -- --nocapture
      - name: Full backend regression
        if: always()
        working-directory: source
        run: cargo test --locked --all-targets --no-fail-fast && cargo fmt --all --check && cargo clippy --locked --all-targets -- -D warnings
  rs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify exact public source
        run: |
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.rs.git
          git -C source fetch --no-tags --depth=1 origin 8058124d385e930a39255146ecc346c19d4d4077
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 8058124d385e930a39255146ecc346c19d4d4077
          git -C source rev-parse 'HEAD^{tree}'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Actual focused guest or native object execution
        working-directory: source
        run: cargo build --locked --bin attoc && node tests/callable_guest_execution.mjs && cargo test --locked --test source_callable_types --test direct_lambda
      - name: Full backend regression
        if: always()
        working-directory: source
        run: cargo test --locked --all-targets --no-fail-fast
