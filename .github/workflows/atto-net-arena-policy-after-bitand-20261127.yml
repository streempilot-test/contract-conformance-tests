name: Atto current main CIL arena policy regression
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-net-arena-policy-after-bitand-20261127.yml']
permissions:
  contents: read
jobs:
  clr:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact public merged source
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.net.git 9e90a08d42452b8357daa4b10353ad390bed3dd7
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 9e90a08d42452b8357daa4b10353ad390bed3dd7
          git -C source rev-parse HEAD^{tree}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Execute previously blocked original shared guest
        shell: bash
        run: |
          set -euo pipefail
          cd source
          dotnet run -c Release --project verification/Ores.Net.ArenaPolicyGuestProbe/Ores.Net.ArenaPolicyGuestProbe.csproj
