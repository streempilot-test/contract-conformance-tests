name: Exact Rust Record delimiter compiler
on:
  push:
    branches: [verify/atto-rust-record-delimiters-20261127]
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GIT_TERMINAL_PROMPT: '0'
      SOURCE_SHA: e193c527eae89dc6efba08e1667e3bbac3aa66d6
      SOURCE_TREE: 3f7e122016e4a525e2ec4f22558daafa380bc8bb
    steps:
      - name: Fetch public Rust source and verify exact commit and tree
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/atto-rust"
          cd "$RUNNER_TEMP/atto-rust"
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.rs.git "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git fsck --strict --no-dangling
          printf 'EXACT_PUBLIC_SOURCE %s %s\n' "$SOURCE_SHA" "$SOURCE_TREE"
      - name: Compile and run focused Record tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/atto-rust"
          rustc --version
          cargo test --locked --test parenthesized_named_record
      - name: Run Rust full regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/atto-rust"
          cargo test --locked --all-targets --no-fail-fast
      - name: Inspect guest test harness prerequisites
        shell: bash
        run: |
          cd "$RUNNER_TEMP/atto-rust"
          node --version
          node --check tests/closed_record_guest.mjs
      - name: Compare inherited failures on exact predecessor
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/atto-rust"
          git -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.rs.git 2bab06df96d9ae6257d0001f17b8415dc8f181c2
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD^{tree})" = d41d92dfea4889af9ce792c0b443766d321ff13b
          cargo test --locked --test fixtures --test lambda_hardening --no-fail-fast
