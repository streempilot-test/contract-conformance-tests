name: Exact Java contextual scalar guest regression
on:
  push:
    branches: ['verify/atto-java-contextual-20261127']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_HEAD: c9e4529f25f90d53eb186797b7492116dde3c26d
      SOURCE_TREE: 03b64358ae332b747726b47ac4790bd41d6760d1
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Fetch exact public source
        run: |
          set -euo pipefail
          git init source
          git -C source -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.java.git "$SOURCE_HEAD"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git -C source rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git -C source fsck --full --no-reflogs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Execute actual Graal guest and related parser regressions
        working-directory: source
        run: |
          set -euo pipefail
          java -version
          mvn -B -ntp -Dtest=ActorContinuationLedgerTest,ActorRuntimeTest,ActorContinuationTerminalResourceFailureTest test
      - name: Verify source unchanged
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git -C source diff --exit-code HEAD --
