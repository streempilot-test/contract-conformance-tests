name: Atto current-main conditional and strict lint refresh
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-conditional-refresh-20261127.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: rust-lint
            repo: atto-source.rs
            head: 0106a2d8b05afd0b5a4ce87338d17df3acefa729
            tree: a00df83ef8ffddd4c66bd5847310e127a64e4716
          - lane: rust-conditional
            repo: atto-source.rs
            head: 561a46ed6e29dfc084a65feca1233fc008974250
            tree: 6988cddcf314d1e8abb60f633aa233ec305d84d6
          - lane: java
            repo: atto-source.java
            head: 95a927323243701386ccd3eab869912db2a1b255
            tree: 4954b199288330508b408ed96a99f938e1ed1abf
          - lane: cranelift
            repo: atto-source.cranelift
            head: bda1547a9d2b6230340ffe84dc03729c8f77459d
            tree: f8bd84ed940e017031bf45c23c48f727d07d6b58
          - lane: llvm
            repo: atto-source.llvm
            head: caf977651375dfac267db513d4a5c0a59a8076d4
            tree: 340ca177003b8eacdf09acf94e2ce703d3c7ede1
    steps:
      - name: Fetch verified exact public source without credentials
        env:
          REPO: ${{ matrix.repo }}
          SOURCE_HEAD: ${{ matrix.head }}
          SOURCE_TREE: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          mkdir source
          git -C source init -q
          git -C source -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 "https://github.com/atto-lang/$REPO.git" "$SOURCE_HEAD"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git -C source diff --quiet HEAD --
          test -z "$(git -C source ls-files --others --exclude-standard)"
          git -C source rev-parse HEAD 'HEAD^{tree}'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: startsWith(matrix.lane, 'rust') || matrix.lane == 'cranelift'
        with:
          toolchain: '1.99.1'
          components: clippy
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        if: matrix.lane == 'java'
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install native LLVM toolchain
        if: matrix.lane == 'llvm'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq llvm-18-dev clang-18 cmake ninja-build
      - name: Execute scoped compiler tests
        working-directory: source
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          case "$LANE" in
            rust-lint) cargo test --locked --all-targets; cargo clippy --locked --all-targets -- -D warnings ;;
            rust-conditional) cargo test --locked --test canonical_keyword_conditionals_main; cargo test --locked --all-targets; cargo clippy --locked --all-targets -- -D warnings ;;
            cranelift) cargo test --locked --all-targets; cargo clippy --locked --all-targets -- -D warnings ;;
            java) mvn -B -ntp -Dtest=CanonicalConditionalJoinCurrentMainTest,CanonicalSixConditionalMainTest test ;;
            llvm)
              cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
              cmake --build build --target oreslang-llvmc --parallel 2
              python3 tests/value_elif_native_matrix.py --compiler "$PWD/build/oreslang-llvmc" --clang "$(command -v clang-18)"
              python3 tests/ternary_native_matrix.py --compiler "$PWD/build/oreslang-llvmc" --clang "$(command -v clang-18)"
              ;;
            *) exit 1 ;;
          esac
          git diff --quiet HEAD --
          echo "SCOPED_EXECUTED_TESTS_COMPLETE=$LANE"
