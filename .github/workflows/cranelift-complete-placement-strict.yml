name: Cranelift complete placement strict qualification
on:
  push:
    branches: [ci/cranelift-complete-placement-strict-20261127]
    paths: [.github/workflows/cranelift-complete-placement-strict.yml]
permissions: {}
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Verify exact source tree
        run: |
          set -euo pipefail
          git init -q source
          git -C source -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.cranelift.git a15fe9e604da649549b8fc7e4e7863e4f5010fe9
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = a15fe9e604da649549b8fc7e4e7863e4f5010fe9
          test "$(git -C source rev-parse 'HEAD^{tree}')" = 00b579895125107b0ff69c70a7150d14c90ee759
      - name: Strict Clippy and linked native placement controls
        working-directory: source
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          cargo +1.99.1 clippy --locked --all-targets -- -D warnings
          cargo +1.99.1 test --locked --test ownership_bang_admission -- --nocapture
          cargo +1.99.1 test --locked physical_layout -- --nocapture
          cargo +1.99.1 test --locked
          git diff --exit-code HEAD --
          test "$(git rev-parse 'HEAD^{tree}')" = 00b579895125107b0ff69c70a7150d14c90ee759
          echo "EXECUTED_INTEGRATION_TREE=00b579895125107b0ff69c70a7150d14c90ee759"
