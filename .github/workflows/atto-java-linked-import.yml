name: Java exact linked import guest and scope qualification
on:
  push:
    branches: ['ci/atto-java2018-linked-import-20261127']
permissions: {}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
    steps:
      - name: Verify exact public source
        run: |
          set -euo pipefail
          git init source
          git -C source -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.java.git c3a2ec52400846502ff87e812b5cd5f1b1d8a929
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = c3a2ec52400846502ff87e812b5cd5f1b1d8a929
          test "$(git -C source rev-parse HEAD^{tree})" = 610d38dcfd8165bfc6d86a2c988db71c892ecae0
          git -C source fsck --full --strict
          git -C source ls-tree -r HEAD | awk '$1 != "100644" && $1 != "100755" {bad=1} END{exit bad}'
          test -z "$(git -C source status --porcelain)"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - name: Execute scalar and linked guest and precedence regressions
        working-directory: source
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=AttoScalarV1GuestTest,AttoDemoMultifileSevenCaseGuestTest,ImportsQualifiedCallTest,ImplicitSelfMethodCallTest,AttoImportedModuleClassGuestTest -DfailIfNoTests=true clean test
