name: Atto current CIL policy and native division
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-current-policy-division-20261127.yml']
permissions:
  contents: read
jobs:
  clr:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch exact public source
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.net.git 1b5d250f0c5d3bb63a5ab2f8e79f1c27e7a5b59c
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 1b5d250f0c5d3bb63a5ab2f8e79f1c27e7a5b59c
          git -C source rev-parse HEAD^{tree}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd source && bash verification/Ores.Net.ArenaPolicyGuestProbe/run-guest-probes.sh
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch exact public source
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.cranelift.git a597a636df4d5cb7d250ede883c53a89cd36bbbc
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = a597a636df4d5cb7d250ede883c53a89cd36bbbc
          git -C source rev-parse HEAD^{tree}
      - run: cd source && cargo test --locked --test checked_division_aot -- --nocapture
