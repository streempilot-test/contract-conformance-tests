name: Atto latest differential arena integration
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-latest-differential-integration-20261127.yml']
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: rs
            head: 25ec44dbd5b08d0f350826e5abb109a80ea2767a
            base: 56ba0cf3da850dab770daee3ca03359db438f190
          - backend: js
            head: cba06ca4b700a120ecfa38d3a25d83b9b0b5f56c
            base: c8b2bfe6a90c77239a9d33a870583d3904deb288
    steps:
      - name: Reconstruct exact integration
        env:
          BACKEND: ${{ matrix.backend }}
          HEAD_SHA: ${{ matrix.head }}
          BASE_SHA: ${{ matrix.base }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags "https://github.com/atto-lang/atto-source.$BACKEND.git" "$HEAD_SHA" "$BASE_SHA"
          git -C source checkout --detach "$BASE_SHA"
          git -C source -c user.name=CI -c user.email=ci@example.invalid merge --no-edit --no-ff "$HEAD_SHA"
          git -C source rev-parse HEAD^{tree}
          test "$(git -C source hash-object tests/arena-policy-differential-v1.mjs)" = f98055af7bb9b8952664946d2b2a1f3a735dc283
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute Rust compiled Wasm corpus
        if: matrix.backend == 'rs'
        shell: bash
        run: |
          set -euo pipefail
          cd source
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 build --locked --release --bin attoc
          ATTOC="$PWD/target/release/attoc" node tests/arena-quota-lifecycle-guest.mjs
      - name: Execute real ESM corpus
        if: matrix.backend == 'js'
        shell: bash
        run: |
          set -euo pipefail
          cd source
          node --test tests/arena-quota-lifecycle-guest.test.mjs
