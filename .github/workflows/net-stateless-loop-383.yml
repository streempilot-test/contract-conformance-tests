name: Exact direct CIL stateless loop NativeAOT
on:
  pull_request:
    paths:
      - '.github/workflows/net-stateless-loop-383.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  net:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Authenticate exact public source
        run: |
          set -euo pipefail
          git init src
          git -C src -c credential.helper= -c http.extraHeader= fetch --depth=1 --no-tags https://github.com/atto-lang/atto-source.net.git 386081cf402358ffc513185a6f105e0288425238
          git -C src checkout --detach FETCH_HEAD
          test "$(git -C src rev-parse HEAD)" = 386081cf402358ffc513185a6f105e0288425238
          test "$(git -C src write-tree)" = fe385de6f619bfa44371e2dbdb83526bec86b553
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Real compiled CIL and NativeAOT guests
        run: |
          set -euo pipefail
          cd src
          bash scripts/test-cil-stateless-value-loop.sh
          git diff --exit-code
      - name: Existing direct CIL integration and guest regression
        run: |
          set -euo pipefail
          cd src
          bash scripts/verify-direct-cil-integration.sh
          bash scripts/test-cil-guest.sh
