name: Atto combined scalar explicit sequences
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-cranelift-combined-seq-v1.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch exact public source
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.cranelift.git 32d297939f4501733e1f56264c4e51e6b2eea913
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 32d297939f4501733e1f56264c4e51e6b2eea913
          git -C source rev-parse HEAD^{tree}
      - run: cd source && cargo test --locked --test combined_scalar_features -- --nocapture
