name: Atto exact Rust full strict compiler and Chromium
on:
  push:
    branches: [ci/atto-rust-select-public-strict-20261126]
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Verify exact anonymous public source
        env:
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          git init source
          cd source
          git -c credential.helper= fetch --depth=1 --no-tags https://github.com/atto-lang/atto-source.rs.git 75cf440c14ca33ff420c8aa97953c4558bbb4748
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 75cf440c14ca33ff420c8aa97953c4558bbb4748
          test "$(git rev-parse HEAD^{tree})" = fe4addde2232afbb76e05cbb0711247e78d0c623
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Full source-owned strict verification
        working-directory: source
        run: bash scripts/verify-select-plans-exact-head.sh 75cf440c14ca33ff420c8aa97953c4558bbb4748
