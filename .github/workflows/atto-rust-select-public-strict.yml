name: Atto exact Rust full strict compiler and Chromium
on:
  push:
    branches: [ci/atto-rust-select-public-strict-20261126]
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Verify exact anonymous public source
        env:
          GIT_TERMINAL_PROMPT: "0"
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          git init source
          cd source
          git -c credential.helper= fetch --depth=1 --no-tags https://github.com/atto-lang/atto-source.rs.git 2e5d356ec8cb9f00260a760c1d76499dfd8d15ba
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 2e5d356ec8cb9f00260a760c1d76499dfd8d15ba
          test "$(git rev-parse HEAD^{tree})" = 6e337173c7c4ad558fe5b4dd101f2d8ed9f25a28
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Full source-owned strict verification
        working-directory: source
        run: bash scripts/verify-select-plans-exact-head.sh 2e5d356ec8cb9f00260a760c1d76499dfd8d15ba
