name: Atto native host fence and frontend regression qualification
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-host-fence-regression-20261127.yml']
permissions:
  contents: read
concurrency:
  group: atto-host-fence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: cranelift
            repo: atto-source.cranelift
            head: 380a052472e679981376a15c0b1995b18922dbb0
            tree: 5d0f464ec58c0dceec18693dc518cd9843aca141
    steps:
      - name: Fetch public exact tree without source credentials
        env:
          REPO: ${{ matrix.repo }}
          HEAD: ${{ matrix.head }}
          TREE: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          mkdir source
          git -C source init -q
          git -C source -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 "https://github.com/atto-lang/$REPO.git" "$HEAD"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$HEAD"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "$TREE"
          git -C source diff --quiet HEAD --
          test -z "$(git -C source ls-files --others --exclude-standard)"
          git -C source rev-parse HEAD 'HEAD^{tree}'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: matrix.lane == 'cranelift'
        with:
          toolchain: '1.99.1'
          components: clippy
      - name: Execute exact host-only fence race and sanitizer matrix or compiler tests
        working-directory: source
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          case "$LANE" in
            forge) include=shared; testfile=verification/native_select_continuation_multi_owner_test.cpp ;;
            llvm) include=src/main/cpp; testfile=tests/native_select_continuation_multi_owner_test.cpp ;;
            cranelift)
              cargo test --locked --all-targets
              cargo clippy --locked --all-targets -- -D warnings
              echo CRANELIFT_STRICT_CLIPPY_PASS
              exit 0 ;;
            *) exit 1 ;;
          esac
          for cxx in g++ clang++; do
            "$cxx" -std=c++20 -pthread -O2 -Wall -Wextra -Werror -I "$include" "$testfile" -o "$RUNNER_TEMP/fence"
            timeout 180 "$RUNNER_TEMP/fence" | tee "$RUNNER_TEMP/fence-$cxx.txt"
            grep -F 'CLAIM_CANCEL_STRESS_PASS rounds=100000' "$RUNNER_TEMP/fence-$cxx.txt"
            grep -F 'PASS 640 native owner settlements' "$RUNNER_TEMP/fence-$cxx.txt"
          done
          clang++ -std=c++20 -pthread -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -I "$include" "$testfile" -o "$RUNNER_TEMP/fence-san"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 timeout 240 "$RUNNER_TEMP/fence-san" | tee "$RUNNER_TEMP/fence-san.txt"
          grep -F 'CLAIM_CANCEL_STRESS_PASS rounds=100000' "$RUNNER_TEMP/fence-san.txt"
          grep -F 'PASS 640 native owner settlements' "$RUNNER_TEMP/fence-san.txt"
          echo HOST_ONLY_RACE_AND_ASAN_UBSAN_PASS
