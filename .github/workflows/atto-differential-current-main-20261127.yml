name: Atto differential arena policy current-main
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-differential-current-main-20261127.yml']
permissions:
  contents: read
jobs:
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: rs
            head: 25ec44dbd5b08d0f350826e5abb109a80ea2767a
          - backend: js
            head: cba06ca4b700a120ecfa38d3a25d83b9b0b5f56c
    steps:
      - name: Fetch exact public source
        env:
          BACKEND: ${{ matrix.backend }}
          HEAD_SHA: ${{ matrix.head }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 "https://github.com/atto-lang/atto-source.$BACKEND.git" "$HEAD_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$HEAD_SHA"
          git -C source rev-parse HEAD^{tree}
          test "$(git -C source hash-object tests/arena-policy-differential-v1.mjs)" = f98055af7bb9b8952664946d2b2a1f3a735dc283
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Rust frontend and execute generated Wasm corpus
        if: matrix.backend == 'rs'
        shell: bash
        run: |
          set -euo pipefail
          cd source
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 build --locked --release --bin attoc
          ATTOC="$PWD/target/release/attoc" node tests/arena-quota-lifecycle-guest.mjs
      - name: Execute real compiler-emitted ESM corpus
        if: matrix.backend == 'js'
        shell: bash
        run: |
          set -euo pipefail
          cd source
          node --test tests/arena-quota-lifecycle-guest.test.mjs
