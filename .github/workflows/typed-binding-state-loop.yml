name: Typed binding state loop real guest gate
on:
  pull_request:
    paths:
      - '.github/workflows/typed-binding-state-loop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Authenticate exact public source
        run: |
          set -euo pipefail
          git init src
          git -C src -c credential.helper= -c http.extraHeader= fetch --depth=1 --no-tags https://github.com/atto-lang/atto-source.rs.git fc3c662b592543642d56b80d885ca371c2014c43
          git -C src checkout --detach FETCH_HEAD
          test "$(git -C src rev-parse HEAD)" = fc3c662b592543642d56b80d885ca371c2014c43
          test "$(git -C src rev-parse HEAD^{tree})" = d0e67e4e27cbf4c3a4bcbe1c49f1f9cd7049b98a
          test "$(git -C src write-tree)" = d0e67e4e27cbf4c3a4bcbe1c49f1f9cd7049b98a
      - name: Execute actual native and wasm32 compilers and all guests
        run: |
          set -euo pipefail
          cd src
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          cargo +1.85.1 build --locked --release --bin attoc
          cargo +1.85.1 rustc --locked --release --lib --target wasm32-unknown-unknown --crate-type cdylib -- -C link-arg=--max-memory=67108864
          ATTOC=target/release/attoc node tests/conformance.mjs
          cargo +1.85.1 test --locked --test value_loop_tuple_boundary --test tuple_binding_admission --test grouped_spawn_admission
          git diff --exit-code
