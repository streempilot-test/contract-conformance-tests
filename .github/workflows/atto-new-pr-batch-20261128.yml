  contents: read
jobs:
  java_2087:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Exact public integration
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= -c http.extraHeader= fetch --no-tags https://github.com/atto-lang/atto-source.java.git 94ba0779b39a36a802cd7e9c7c40040e00be05b0 66f7bbb99576bd493b3bfced2c01b1af992a89e8
          git -C source checkout --detach 66f7bbb99576bd493b3bfced2c01b1af992a89e8
          git -C source -c user.name=CI -c user.email=ci@example.invalid merge --no-edit --no-ff 94ba0779b39a36a802cd7e9c7c40040e00be05b0
          git -C source rev-parse HEAD^{tree}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Execute candidate tests
        run: |
          set -euo pipefail
          cd source
          mvn -B -Dtest=SymbolConstructorCandidateTest,RecursiveRecordParserTest test
