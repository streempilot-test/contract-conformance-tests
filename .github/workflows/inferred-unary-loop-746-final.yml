name: Exact current-main inferred unary loop final gate
on:
  pull_request:
    paths:
      - '.github/workflows/inferred-unary-loop-746-final.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Authenticate and execute actual Rust compiler
        run: |
          set -euo pipefail
          git init src
          git -C src -c credential.helper= -c http.extraHeader= fetch --depth=1 --no-tags https://github.com/atto-lang/atto-source.rs.git 96a74950baab562647da212071dc3a83c54cf1ff
          git -C src checkout --detach FETCH_HEAD
          test "$(git -C src rev-parse HEAD)" = 96a74950baab562647da212071dc3a83c54cf1ff
          test "$(git -C src write-tree)" = 12116cb5fcc8779eb923babbf52701951bd650cd
          cd src
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          cargo +1.85.1 build --locked --release --bin attoc
          cargo +1.85.1 rustc --locked --release --lib --target wasm32-unknown-unknown --crate-type cdylib -- -C link-arg=--max-memory=67108864
          ATTOC=target/release/attoc node tests/conformance.mjs
          git diff --exit-code
