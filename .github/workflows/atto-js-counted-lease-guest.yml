name: Exact Stage-0 proof and browser suspension qualification
on:
  pull_request:
    branches: ['main']
    paths: ['.github/workflows/atto-js-counted-lease-guest.yml']
permissions: {}
jobs:
  stage0:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify exact public compiler and Atto source
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          fetch() {
            git init "$1"
            git -C "$1" -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 "https://github.com/atto-lang/$2.git" "$3"
            git -C "$1" -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
            test "$(git -C "$1" rev-parse HEAD)" = "$3"
            test "$(git -C "$1" rev-parse HEAD^{tree})" = "$4"
            test "$(git -C "$1" write-tree)" = "$4"
            git -C "$1" diff --exit-code HEAD
          }
          fetch compiler atto-source.llvm 19a3adb40e3b8a5578f9fa378bcc7e40ec005137 6a342f49dba8b98cf866d5f1ac44e99bf39c1abb
          fetch seed atto-source.atto ad47df21e4b2d1eb1a1b75194364abb607e86536 912f0ccd5e95269a37e53fec304b49bb014b5299
          test "$(git -C seed hash-object src/strict_i64_interval.atto)" = 72f469d37da8a521f062e8869e9fb0910497a59b
          test "$(git -C seed hash-object scripts/verify-strict-i64-interval-native.mjs)" = 3509ef9f4f103783984fc0f9291a06b3019b9942
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build actual LLVM compiler and execute all native proof kernels
        run: |
          set -euo pipefail
          cmake -S compiler -B "$RUNNER_TEMP/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/build" --target oreslang-llvmc -j2
          compiler="$RUNNER_TEMP/build/oreslang-llvmc"
          test -x "$compiler"
          digest="$(sha256sum "$compiler" | cut -d' ' -f1)"
          node seed/scripts/verify-strict-i64-interval-native.mjs "$compiler" "$digest" seed/src/strict_i64_interval.atto 72f469d37da8a521f062e8869e9fb0910497a59b | tee "$RUNNER_TEMP/proof.log"
          grep -F '"passed":1867,"total":1867,"stage":0,"selfHosted":false' "$RUNNER_TEMP/proof.log"
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify exact public Rust and Wasm qualification trees
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          fetch() {
            git init "$1"
            git -C "$1" -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 "https://github.com/atto-lang/$2.git" "$3"
            git -C "$1" -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
            test "$(git -C "$1" rev-parse HEAD)" = "$3"
            test "$(git -C "$1" rev-parse HEAD^{tree})" = "$4"
            test "$(git -C "$1" write-tree)" = "$4"
            git -C "$1" diff --exit-code HEAD
          }
          fetch compiler atto-source.rs 530bd6c27b6dcd36362035e996ab021186d2aaf6 c053493a272dc614c62ee6df9527d1b1f1b2dc21
          fetch verifier atto-source.wasm e34e2f70d50345cc26c21b2748a5539f53eecf81 571a8a35971e14ca9d598f405b32448938557ec1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build two independent compiler artifacts and execute guest controls
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          (cd compiler && CARGO_TARGET_DIR="$RUNNER_TEMP/target-a" cargo +1.85.1 build --locked --release --target wasm32-unknown-unknown)
          (cd compiler && CARGO_TARGET_DIR="$RUNNER_TEMP/target-b" cargo +1.85.1 build --locked --release --target wasm32-unknown-unknown)
          a="$RUNNER_TEMP/target-a/wasm32-unknown-unknown/release/atto_compiler.wasm"
          b="$RUNNER_TEMP/target-b/wasm32-unknown-unknown/release/atto_compiler.wasm"
          cmp "$a" "$b"
          digest="$(sha256sum "$a" | cut -d' ' -f1)"
          node verifier/tests/suspension-alias-browser-qualification.mjs "$a" "$digest" | tee "$RUNNER_TEMP/wasm.log"
          grep -F SUSPENSION_ALIAS_WASM_CANDIDATE_PASS "$RUNNER_TEMP/wasm.log"
          node --test verifier/tests/unicode-source-boundary-v1.test.mjs
