name: Atto Rust callable intrinsics and physical HDL qualification
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-rs-hdl-parity.yml']
permissions:
  contents: read
jobs:
  rs-callable:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify pinned public compiler
        run: |
          git init -q source
          git -C source remote add origin https://github.com/atto-lang/atto-source.rs.git
          git -C source fetch --no-tags --depth=1 origin 476fc36e96a89d3f5ffa0f37b981002dc2060712
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 476fc36e96a89d3f5ffa0f37b981002dc2060712
          test "$(git -C source hash-object src/check/direct_lambda.rs)" = a2cd1c12911c3017ee38e968627beb99340000ba
          test "$(git -C source hash-object src/parser.rs)" = 61bb6689f42887a9dec6de7d4b85b1bdf7741f09
          test "$(git -C source hash-object tests/callable_guest_execution.mjs)" = 1ad59489f9f34dc9837a8bc630a1e97408bf6e5a
          test "$(git -C source hash-object tests/direct_lambda.rs)" = 83587906aee71ece1151c26cd511592e06ca9d42
          test "$(git -C source hash-object tests/direct_lambda_audit.rs)" = b5a2c8ba0281ecda04389b1b8e6e1a42794a38ad
          test "$(git -C source hash-object tests/source_callable_types.rs)" = 3def8765952c54f33f55380a3381ad9496c476b5
          test "$(git -C source rev-parse 'HEAD^{tree}')" = d269f3f103963a7648617930f24cbcdfa708c403
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Native compiler and actual Wasm guests
        working-directory: source
        run: |
          cargo build --locked --bin attoc
          node tests/callable_guest_execution.mjs
      - name: Focused callable diagnostics
        if: always()
        working-directory: source
        run: cargo test --locked --test direct_lambda --test source_callable_types --no-fail-fast
      - name: Complete Rust regression
        if: always()
        working-directory: source
        run: cargo test --locked --all-targets --no-fail-fast
