name: Exact public Atto placement regression
on:
  push:
    branches: ['verify/atto-lifetime-placement-20261127']
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: llvm
            pr: 1075
            head: e320a168981d246970f165906fa6741ed3f48767
            tree: 771929b1efe7f3217e95e39dea9bcd364455283c
          - backend: cranelift
            pr: 221
            head: 8128574d778657dd798709c700f97e5b4a1a8553
            tree: d966a7310b8c3dbb18e8fe294c3ab659d681e827
    env:
      BACKEND: ${{ matrix.backend }}
      SOURCE_HEAD: ${{ matrix.head }}
      SOURCE_TREE: ${{ matrix.tree }}
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Fetch public source without credentials and bind exact tree
        shell: bash
        run: |
          set -euo pipefail
          test "$BACKEND" = llvm || test "$BACKEND" = cranelift
          git init source
          git -C source -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 "https://github.com/atto-lang/atto-source.$BACKEND.git" "$SOURCE_HEAD"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git -C source rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git -C source diff --exit-code HEAD --
          git -C source fsck --full --no-reflogs
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/atto-target" >> "$GITHUB_ENV"
          echo "EXACT_SOURCE=$SOURCE_HEAD TREE=$SOURCE_TREE"
      - name: Execute LLVM repository Rust-hosted frontend and native placement guest
        if: matrix.backend == 'llvm'
        working-directory: source/frontend
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          clang --version
          node --version
          cargo test --locked --lib
          cargo build --locked --release --bin attoc
          ATTOC="$CARGO_TARGET_DIR/release/attoc" node tests/physical_placement_native_clang.mjs
      - name: Execute real Cranelift compiler regression and strict Clippy
        if: matrix.backend == 'cranelift'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Verify tracked source unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git -C source diff --exit-code HEAD --
          echo "VERIFIED_AFTER_TEST=$SOURCE_HEAD"
