name: Exact public Atto placement regression
on:
  push:
    branches: ['verify/atto-lifetime-placement-20261127']
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cranelift
            pr: 229
            head: 3eecc91d06caa5b8f34cef89afc5ae072b752bea
            tree: aea7d0bb55ca0bd9d5f1b99bd6e342e129a755ad
    env:
      BACKEND: ${{ matrix.backend }}
      SOURCE_HEAD: ${{ matrix.head }}
      SOURCE_TREE: ${{ matrix.tree }}
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Fetch public source without credentials and bind exact tree
        shell: bash
        run: |
          set -euo pipefail
          test "$BACKEND" = llvm || test "$BACKEND" = cranelift
          git init source
          git -C source -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 "https://github.com/atto-lang/atto-source.$BACKEND.git" "$SOURCE_HEAD"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git -C source rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git -C source diff --exit-code HEAD --
          git -C source fsck --full --no-reflogs
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/atto-target" >> "$GITHUB_ENV"
          echo "EXACT_SOURCE=$SOURCE_HEAD TREE=$SOURCE_TREE"
      - name: Execute LLVM repository Rust-hosted frontend and native placement guest
        if: matrix.backend == 'llvm'
        working-directory: source/frontend
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          clang --version
          node --version
          cargo test --locked --lib
          cargo build --locked --release --bin attoc
          ATTOC="$CARGO_TARGET_DIR/release/attoc" node tests/physical_placement_native_clang.mjs
      - name: Execute real Cranelift compiler regression and strict Clippy
        if: matrix.backend == 'cranelift'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --locked --bin orescranelift
          dir="$RUNNER_TEMP/implicit"
          mkdir -p "$dir"
          printf '%s\n' 'pub fnc main() -> int {return 42000<Millimeter>.to_unit<Meter>()/1<Meter>;}' > "$dir/guest.atto"
          "$CARGO_TARGET_DIR/debug/orescranelift" emit-object "$dir/guest.atto" > "$dir/guest.o"
          cat > "$dir/host.c" <<'EOF'
          #include <stdint.h>
          #include <assert.h>
          extern int32_t oreslang_scalar_entry(int64_t,int64_t,int64_t,int64_t,int64_t*);
          int main(void){int64_t out=123;assert(oreslang_scalar_entry(0,0,0,0,&out)==0);assert(out==42);}
          EOF
          cc -std=c11 -Wall -Werror "$dir/host.c" "$dir/guest.o" -o "$dir/guest"
          "$dir/guest"
          printf '%s\n' 'pub fnc main() -> int {return 42<Meter>/1<Second>;}' > "$dir/bad.atto"
          if "$CARGO_TARGET_DIR/debug/orescranelift" emit-object "$dir/bad.atto" > "$dir/bad.o"; then exit 1; fi
          test ! -s "$dir/bad.o"
          echo CRANELIFT_IMPLICIT_GUEST_PASS
      - name: Verify tracked source unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git -C source diff --exit-code HEAD --
          echo "VERIFIED_AFTER_TEST=$SOURCE_HEAD"
