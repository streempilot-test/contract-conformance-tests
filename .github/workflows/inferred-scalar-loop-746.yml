name: Exact inferred scalar loop PR 746 real guests
on:
  pull_request:
    paths:
      - '.github/workflows/inferred-scalar-loop-746.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Authenticate and execute actual Rust compiler
        run: |
          set -euo pipefail
          git init src
          git -C src -c credential.helper= -c http.extraHeader= fetch --depth=1 --no-tags https://github.com/atto-lang/atto-source.rs.git 94b52cbce976ebdde95dbab863fc6ecace4da244
          git -C src checkout --detach FETCH_HEAD
          test "$(git -C src rev-parse HEAD)" = 94b52cbce976ebdde95dbab863fc6ecace4da244
          test "$(git -C src write-tree)" = dedd3459899fbf60e128170f84ee2adb3323df3e
          cd src
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          cargo +1.85.1 build --locked --release --bin attoc
          cargo +1.85.1 rustc --locked --release --lib --target wasm32-unknown-unknown --crate-type cdylib -- -C link-arg=--max-memory=67108864
          ATTOC=target/release/attoc node tests/conformance.mjs
          cargo +1.85.1 test --locked --test value_loop_tuple_boundary --test tuple_binding_admission --test grouped_spawn_admission
          git diff --exit-code
