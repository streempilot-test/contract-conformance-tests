name: Atto Java exact current main guest qualification
on:
  push:
    branches: [ci/atto-java-recur-context-20261127]
permissions:
  contents: read
jobs:
  guest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: contextual
            head: 1bd401dae243a454c7d8140f2e7f7c35242e718a
            tree: 5ef40c23eed5708206e47268ee57fd1232dd03e7
            tests: ContextualIntGuestTest,AttoStatelessValueLoopTest
          - profile: recur
            head: 421b08c7089202a97583d406b65a7c920ac952ae
            tree: b7779fb7f32166d0ad2e0233318bdd1f40e72980
            tests: AttoStateValueLoopTest,ContextualIntGuestTest,AttoStatelessValueLoopTest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify public exact commit and tree
        env:
          EXPECTED_HEAD: ${{ matrix.head }}
          EXPECTED_TREE: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          git init guest
          cd guest
          git -c credential.helper= fetch --depth=1 https://github.com/atto-lang/atto-source.java.git "$EXPECTED_HEAD"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git fsck --full
      - uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '25'
      - name: Execute actual Java guest tests
        working-directory: guest
        env:
          TESTS: ${{ matrix.tests }}
        run: mvn -B -ntp "-Dtest=$TESTS" test
