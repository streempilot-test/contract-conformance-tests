name: Atto NET stored Pair 396 exact CoreCLR
on:
  pull_request:
    paths:
      - '.github/workflows/atto-net-stored-pair-396.yml'
permissions:
  contents: read
jobs:
  net:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Pin public compiler and verify changed blobs
        run: |
          set -eu
          git init guest-source
          cd guest-source
          git -c credential.helper= fetch --depth=1 https://github.com/atto-lang/atto-source.net.git 1fb0223e5b8cea1d0f1e64aa42e3be0e857d74d6
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 1fb0223e5b8cea1d0f1e64aa42e3be0e857d74d6
          git rev-parse HEAD^{tree}
          test "$(git hash-object compiler/Ores.Net.Compiler.Core/StructuredSource.cs)" = 0fa09c43f3e4a7da447b3031b86a6d09a8d5f063
          test "$(git hash-object verification/Ores.Net.Tests/Program.cs)" = 1c781c12aba98463441a33e87fe544711a44da43
          test "$(git hash-object verification/Ores.Net.Tests/StructuredCfgLoweringTests.cs)" = 9e927474bf20b3c44e15199df0a3f0cb234cd874
      - name: Run emitted stored Pair guests and full CoreCLR regressions
        working-directory: guest-source
        run: |
          dotnet --version
          dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj --configuration Release -- --stored-pair
          dotnet run --project verification/Ores.Net.Tests/Ores.Net.Tests.csproj --configuration Release
