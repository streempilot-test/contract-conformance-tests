name: Public Atto compiler recovery - exact trees
on:
  push:
    branches: ['ci/atto-exact-browser-native-recovery-20261126']
permissions: {}
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Source-free runner capacity test
        run: |
          set -eu
          rustc --version
          echo '#[test] fn checked_overflow(){assert_eq!(i64::MAX.checked_add(1),None);}' > /tmp/probe.rs
          rustc --test /tmp/probe.rs -o /tmp/probe
          /tmp/probe
  qualify:
    needs: capacity
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: atto-source.rs
            head: a90f6c3d423f0f5f9da6d4326e53ef11ad3d70da
            tree: ed8674b15a24541f7031feda4626f1f1d2613732
            os: ubuntu-24.04
            mode: rust
          - repo: atto-source.rs
            head: 4c82dbfd1dd9cc97c2bee08c890a17c720144ae7
            tree: 530ebab70b34a2e81775d70633cf6024ad8c5425
            os: ubuntu-24.04
            mode: rust-current
          - repo: atto-source.llvm
            head: 48c635a7de89e2a97ffeb2ee506a430e606a5e84
            tree: bc4205a0a5866c4a1b8b4a15c9c806d875874765
            os: macos-15
            mode: llvm19
          - repo: atto-source.llvm
            head: 48c635a7de89e2a97ffeb2ee506a430e606a5e84
            tree: bc4205a0a5866c4a1b8b4a15c9c806d875874765
            os: macos-15
            mode: llvm23
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - name: Verify exact public source and Git objects
        env:
          REPO: ${{ matrix.repo }}
          HEAD_SHA: ${{ matrix.head }}
          TREE_SHA: ${{ matrix.tree }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          git init source
          cd source
          git -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 "https://github.com/atto-lang/${REPO}.git" "$HEAD_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TREE_SHA"
          git fsck --full --strict
          git ls-tree -r HEAD | awk '$1 != "100644" && $1 != "100755" {bad=1} END{exit bad}'
          git ls-tree -r HEAD | wc -l
          test -z "$(git status --porcelain)"
          echo "verified $HEAD_SHA $TREE_SHA"
      - name: Execute real compiler tests
        working-directory: source
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          case "$MODE" in
            rust|rust-current)
              rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
              rustup default 1.85.1
              unset RUST_MIN_STACK
              cargo test --locked --test fixtures
              cargo test --locked --no-fail-fast
              cargo build --locked --release --bin attoc
              cargo rustc --locked --release --lib --target wasm32-unknown-unknown --crate-type cdylib -- -C link-arg=--max-memory=67108864
              sha256sum target/wasm32-unknown-unknown/release/atto_compiler.wasm
              export ATTOC=target/release/attoc
              node tests/conformance.mjs
              node tests/constant_import_guest.mjs
              export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
              node tests/browser-e2e.mjs
              ;;
            cranelift)
              cargo test --locked --no-fail-fast
              ;;
            llvm19)
              brew install llvm@19
              test "$("$(brew --prefix llvm@19)/bin/llvm-config" --version | cut -d. -f1)" = 19
              bash scripts/verify-native-class-string-macos.sh 19
              ;;
            llvm23)
              brew install llvm
              test "$("$(brew --prefix llvm)/bin/llvm-config" --version | cut -d. -f1)" = 23
              bash scripts/verify-native-class-string-macos.sh 23
              ;;
            *) exit 65;;
          esac
