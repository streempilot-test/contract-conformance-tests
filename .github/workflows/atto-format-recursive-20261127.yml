name: Atto formatter membership and recursive fixture qualification
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-format-recursive-20261127.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: format
            repo: atto-format
            head: e5e7e6a9d41c37b12bdd1746870658243250282c
            tree: c2545b63b60a1b680229ba4c7afc46d4e2b70a2f
          - lane: fixture
            repo: atto-platform-conformance
            head: 9e08cdddd1cb4f698fc29f65fea16346e35a7b1a
            tree: d1cdd5e4628c562e60d1c05dc343b24fd092cc54
    steps:
      - name: Fetch exact public source without credentials
        env:
          REPO: ${{ matrix.repo }}
          SOURCE_HEAD: ${{ matrix.head }}
          SOURCE_TREE: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          mkdir source
          git -C source init -q
          git -C source -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 "https://github.com/atto-lang/$REPO.git" "$SOURCE_HEAD"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git -C source diff --quiet HEAD --
          test -z "$(git -C source ls-files --others --exclude-standard)"
          git -C source rev-parse HEAD 'HEAD^{tree}'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: matrix.lane == 'format'
        with:
          toolchain: '1.99.1'
      - name: Execute formatter or fixture regression (not compiler guest proof)
        working-directory: source
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          case "$LANE" in
            format)
              cargo test --locked --offline --lib match_switch::tests::membership_arms_preserve_list_commas_and_type_lists
              cargo test --locked --offline --all-targets
              node --test tests/*.test.mjs
              ;;
            fixture) node --test tests/named-recursive-fnc-v1.test.mjs ;;
            *) exit 1 ;;
          esac
          git diff --quiet HEAD --
          echo "SCOPED_EXECUTED_TESTS_COMPLETE=$LANE"
