name: Cranelift unbound diagnostic and full corpus audit
on:
  push:
    branches: [ci/cranelift-unbound-current-20261127]
    paths: [.github/workflows/cranelift-unbound-current.yml]
permissions: {}
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: cranelift
            repo: atto-source.cranelift
            head: 3107b30a8603b0fca931f179f96227aa887508a8
            tree: 3dc96fc99477d54d5c6a7702217ff1fe13d1d95c
    env:
      PROFILE: ${{ matrix.profile }}
      SOURCE_REPO: ${{ matrix.repo }}
      SOURCE_HEAD: ${{ matrix.head }}
      SOURCE_TREE: ${{ matrix.tree }}
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Verify public exact source trees
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          fetch_exact() {
            git init -q "$4"
            git -C "$4" -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 "https://github.com/atto-lang/$1.git" "$2"
            git -C "$4" checkout --detach FETCH_HEAD
            test "$(git -C "$4" rev-parse HEAD)" = "$2"
            test "$(git -C "$4" rev-parse 'HEAD^{tree}')" = "$3"
            test -z "$(git -C "$4" status --porcelain --untracked-files=all)"
          }
          fetch_exact "$SOURCE_REPO" "$SOURCE_HEAD" "$SOURCE_TREE" "$RUNNER_TEMP/source"
          fetch_exact atto-common-source 4dced89256d994d70956f078abc2a7431cd7a065 24f6adccebd7f9d16b231be04cb70ee45b85f305 "$RUNNER_TEMP/common"
      - name: Build ordinary production scalar compiler
        run: |
          set -euo pipefail
          if [ "$PROFILE" = forge ]; then
            cmake -S "$RUNNER_TEMP/source" -B "$RUNNER_TEMP/build" -DCMAKE_BUILD_TYPE=Release
            cmake --build "$RUNNER_TEMP/build" --target forge_scalar -j2
            compiler="$(find "$RUNNER_TEMP/build" -type f -name forge_scalar -executable -print -quit)"
          else
            rustup toolchain install 1.99.1 --profile minimal --component clippy
            export CARGO_TARGET_DIR="$RUNNER_TEMP/build"
            cd "$RUNNER_TEMP/source"
            cargo +1.99.1 clippy --locked --all-targets -- -D warnings
            cargo +1.99.1 build --locked --release --bin orescranelift
            cargo +1.99.1 test --locked --test unbound_unicode_native -- --nocapture
            cargo +1.99.1 test --locked --test ownership_bang_admission
            cargo +1.99.1 test --locked
            compiler="$CARGO_TARGET_DIR/release/orescranelift"
          fi
          test -x "$compiler"
          echo "COMPILER=$compiler" >> "$GITHUB_ENV"
      - name: Execute every shared case with actual linked native guests
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/common/scripts/run-unicode-native-scalar-conformance-v1.mjs" "$PROFILE" "$RUNNER_TEMP/source" "$SOURCE_HEAD" "$SOURCE_TREE" "$COMPILER"
          test "$(git -C "$RUNNER_TEMP/source" rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test -z "$(git -C "$RUNNER_TEMP/source" status --porcelain --untracked-files=all)"
