name: Atto conformance portable mock identity
on:
  push:
    branches: [ci/atto-conformance713-portable-mock-20261127]
  pull_request:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact public source
        run: |
          git init source
          git -C source fetch --depth=1 https://github.com/atto-lang/atto-platform-conformance.git 6d0f1526be490c951d21cb2225efb55478665779
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 6d0f1526be490c951d21cb2225efb55478665779
          test "$(git -C source rev-parse HEAD^{tree})" = b5c8fac8ebaff5648584b978d101cd8040de16cd
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Execute focused synthetic identity regression
        working-directory: source
        run: node --test tests/spec-audit-compiler-adapter.test.mjs
      - name: Execute unchanged complete host suite
        working-directory: source
        run: npm test
