name: Exact copy mode compiler and conformance gates
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/copy-symmetric-exact-20261127.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Fetch public source without credentials and pin entire tree
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.java.git 6610e7d3113a80ad5abe9690a5e160ff478bf17d
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 6610e7d3113a80ad5abe9690a5e160ff478bf17d
          test "$(git -C source rev-parse HEAD^{tree})" = 8efcffe0c4c0c949b6d658944171d16d202009e7
          test "$(git -C source write-tree)" = 8efcffe0c4c0c949b6d658944171d16d202009e7
          git -C source log -1 --format='%H %T'
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          version: '25.3'
          java-version: '25'
          distribution: graalvm
      - name: Execute strict Java component and race tests
        working-directory: source
        run: |
          set -euo pipefail
          javac -Xlint:all -Werror -d "$RUNNER_TEMP/snapshot" src/main/java/dev/oreslang/types/GuestClassSlots.java src/main/java/dev/oreslang/types/CopyScalarAdmission.java tests/graph-topology-host/ShallowSnapshotHarness.java
          java -Xss256k -cp "$RUNNER_TEMP/snapshot" ShallowSnapshotHarness
      - name: Compile production code and execute targeted JUnit guest and ownership regressions
        working-directory: source
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=DerivedCopyPlanGuestTest,CopyPolicyCompilerTest,OwnershipAndClosureTest,DerivedGraphCopyPlanTest,GraphCopyTransactionTest,CopyPlanCacheTest,GuestClassGraphLeaseTest -DfailIfNoTests=true -Dsurefire.failIfNoSpecifiedTests=true test
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch public source without credentials and pin entire tree
        run: |
          set -euo pipefail
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.rs.git 21df56bd73b05f11e03076d5ff1ae9af028be746
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 21df56bd73b05f11e03076d5ff1ae9af028be746
          test "$(git -C source rev-parse HEAD^{tree})" = 14f6df8c315d4241870038552390ee7924837c93
          test "$(git -C source write-tree)" = 14f6df8c315d4241870038552390ee7924837c93
          git -C source log -1 --format='%H %T'
      - name: Execute Rust copy witness and compiler regression tests
        working-directory: source
        run: |
          set -euo pipefail
          rustc --version
          node --version
          cargo test --locked --test copy_doublebang --test copy_graph_v1 --test layout_trace --test unary_plus_parity --test aosoa_checked_addressing
          cargo build --locked --bin attoc
          node tests/copy_doublebang_guest.mjs
      - name: Check real AOT browser compiler build
        working-directory: source
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          cargo build --locked --release --target wasm32-unknown-unknown --lib
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch public conformance tree without credentials
        run: |
          set -euo pipefail
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-platform-conformance.git 484a95fd38f24ed6485e6f4e6ea8dbaa5a858396
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 484a95fd38f24ed6485e6f4e6ea8dbaa5a858396
          test "$(git -C source rev-parse HEAD^{tree})" = 41bb42cb80dec3da3b8a03ff61be77f1be0b6508
          test "$(git -C source write-tree)" = 41bb42cb80dec3da3b8a03ff61be77f1be0b6508
          git -C source log -1 --format='%H %T'
      - name: Execute registry tests only, no guest parity claim
        working-directory: source
        run: |
          set -euo pipefail
          node --test tests/copy-readonly-sharing-v1.test.mjs tests/copy-readonly-rust-wasm-runner.test.mjs
          echo SCOPE=HOST_FIXTURE_INTEGRITY_ONLY
  portable-copy-guests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: atto-source.rs
            head: 21df56bd73b05f11e03076d5ff1ae9af028be746
            tree: 14f6df8c315d4241870038552390ee7924837c93
            subdir: .
          - repo: atto-source.llvm
            head: 9c6d48f3882064b6308c461341092a9971e2df4e
            tree: a1e4e367c73f4eb3f03d64191bb772a8944aafde
            subdir: frontend
    steps:
      - name: Anonymous source fetch and exact Git identity checks
        env:
          REPO: ${{ matrix.repo }}
          HEAD_SHA: ${{ matrix.head }}
          TREE_SHA: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          git init compiler
          git -C compiler -c credential.helper= fetch --no-tags --depth=1 "https://github.com/atto-lang/${REPO}.git" "$HEAD_SHA"
          git -C compiler checkout --detach FETCH_HEAD
          test "$(git -C compiler rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git -C compiler rev-parse HEAD^{tree})" = "$TREE_SHA"
          test "$(git -C compiler write-tree)" = "$TREE_SHA"
          git init corpus
          git -C corpus -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-platform-conformance.git 484a95fd38f24ed6485e6f4e6ea8dbaa5a858396
          git -C corpus checkout --detach FETCH_HEAD
          test "$(git -C corpus rev-parse HEAD)" = 484a95fd38f24ed6485e6f4e6ea8dbaa5a858396
          test "$(git -C corpus rev-parse HEAD^{tree})" = 41bb42cb80dec3da3b8a03ff61be77f1be0b6508
          test "$(git -C corpus write-tree)" = 41bb42cb80dec3da3b8a03ff61be77f1be0b6508
      - name: Build actual compiler CLI and execute unchanged shared guests
        env:
          HEAD_SHA: ${{ matrix.head }}
          TREE_SHA: ${{ matrix.tree }}
          SUBDIR: ${{ matrix.subdir }}
        run: |
          set -euo pipefail
          ROOT="$(realpath compiler)"
          (cd "$ROOT/$SUBDIR" && cargo build --locked --bin attoc)
          cd corpus
          node --test tests/copy-readonly-rust-wasm-runner.test.mjs
          node scripts/run-copy-readonly-rust-wasm-v1.mjs "$ROOT" "$ROOT/$SUBDIR/target/debug/attoc" "$HEAD_SHA" "$TREE_SHA" 484a95fd38f24ed6485e6f4e6ea8dbaa5a858396 41bb42cb80dec3da3b8a03ff61be77f1be0b6508
