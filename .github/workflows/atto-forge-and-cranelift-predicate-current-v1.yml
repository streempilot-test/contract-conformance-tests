name: Atto native integer predicate qualification
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/atto-forge-and-cranelift-predicate-current-v1.yml']
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    steps:
      - name: Fetch exact public source
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags --depth=1 https://github.com/atto-lang/atto-source.forge.git 18b74b7f3a3dda36f7b8188408862c39ec95579d
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = 18b74b7f3a3dda36f7b8188408862c39ec95579d
          git -C source rev-parse HEAD^{tree}
      - name: Actual native callable test matrix
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          cd source
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --target oresforge -j2
          ctest --test-dir build -R '^oresforge_real_native_recursive_calls$' --output-on-failure --verbose --no-tests=error
  cranelift:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Reconstruct current integration
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git init source
          git -C source -c credential.helper= fetch --no-tags https://github.com/atto-lang/atto-source.cranelift.git f751e14dfc3d92ec2548c5b8fb2af5c53bfad449 c0a453ab5ec695d7e51325a20c31f4bb51ad50ea
          git -C source checkout --detach f751e14dfc3d92ec2548c5b8fb2af5c53bfad449
          git -C source -c user.name=CI -c user.email=ci@example.invalid merge --no-edit --no-ff c0a453ab5ec695d7e51325a20c31f4bb51ad50ea
          git -C source rev-parse HEAD^{tree}
      - run: |
          set -euo pipefail
          cd source
          cargo test --locked --test linked_native_arena_predicates -- --nocapture
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
