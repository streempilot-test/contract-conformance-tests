name: LLVM native baseline regression attribution
on:
  pull_request:
    paths:
      - '.github/workflows/llvm-loop-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Authenticate unchanged public main
        run: |
          set -euo pipefail
          git init src
          git -C src -c credential.helper= -c http.extraHeader= fetch --depth=1 --no-tags https://github.com/atto-lang/atto-source.llvm.git 2ea77477ae2df7a32949b9b3083e47f679d30324
          git -C src checkout --detach FETCH_HEAD
          test "$(git -C src rev-parse HEAD)" = 2ea77477ae2df7a32949b9b3083e47f679d30324
          test "$(git -C src write-tree)" = 9feb2ea5a6594a1c04350a16a1e103013dc6cb10
      - name: Install native toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clang llvm-dev cmake ninja-build nodejs
      - name: Build native compiler and run existing scalar regression
        run: |
          set -euo pipefail
          cd src
          cmake -G Ninja -S . -B "$RUNNER_TEMP/loop-build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DLLVM_DIR="$(llvm-config --cmakedir)"
          cmake --build "$RUNNER_TEMP/loop-build" --target oreslang-llvmc --parallel 2
          export ORESLANG_LLVMC="$RUNNER_TEMP/loop-build/oreslang-llvmc"
          export ATTO_EXECUTED_STEPS=5 ATTO_RECEIPT_PATH="$RUNNER_TEMP/scalar-receipt.json"
          node tests/atto_scalar_v1_execution.mjs
