name: Reconciled return-position state loop real guest gate
on:
  pull_request:
    paths:
      - '.github/workflows/return-state-loop-reconciled.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Authenticate exact source
        run: |
          set -euo pipefail
          git init src
          git -C src -c credential.helper= -c http.extraHeader= fetch --depth=1 --no-tags https://github.com/atto-lang/atto-source.rs.git 0d121aadba66aefa01f7fda3fea08630c73c8f76
          git -C src checkout --detach FETCH_HEAD
          test "$(git -C src rev-parse HEAD)" = 0d121aadba66aefa01f7fda3fea08630c73c8f76
          test "$(git -C src rev-parse HEAD^{tree})" = 77e6fcf8b5c05d7d7d2e9522398bf569c607483a
          test "$(git -C src write-tree)" = 77e6fcf8b5c05d7d7d2e9522398bf569c607483a
      - name: Execute actual native and wasm32 compilers and all guests
        run: |
          set -euo pipefail
          cd src
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          cargo +1.85.1 build --locked --release --bin attoc
          cargo +1.85.1 rustc --locked --release --lib --target wasm32-unknown-unknown --crate-type cdylib -- -C link-arg=--max-memory=67108864
          ATTOC=target/release/attoc node tests/conformance.mjs
          cargo +1.85.1 test --locked --test value_loop_tuple_boundary --test tuple_binding_admission --test grouped_spawn_admission
          git diff --exit-code
